block.eventide-ev-01-dark-pipe.name = Тёмная труба
block.eventide-ev-01-dark-pipe.description = Перемещает жидкости вперёд.
block.eventide-ev-02-pipe-junction.name = Соединение труб
block.eventide-ev-02-pipe-junction.description = Используется для пересечения двух водоводов.
block.eventide-ev-03-pipe-router.name = Распределитель труб
block.eventide-ev-03-pipe-router.description = Равномерно распределяет поступающие жидкости по трём выходам.
block.eventide-ev-04-pipe-bridge.name = Мост водоводов
block.eventide-ev-04-pipe-bridge.description = Используется для пересечения нескольких линий распределения или участков местности и соединения водоводов.
block.eventide-ev-05-liquid-tank.name = Резервуар для жидкостей
block.eventide-ev-05-liquid-tank.description = Хранит жидкости и выводит их во все стороны.
block.eventide-ev-dark-pump.name = Тёмный насос
block.eventide-ev-dark-pump.description = Медленно перекачивает воду.
block.eventide-ev-01-iron-node.name = Железный узел
block.eventide-ev-02-rybek-node.name = Узел Rybek
block.eventide-ev-03-burning-generator.name = Генератор сжигания
block.eventide-ev-03-burning-generator.description = Сжигает уголь для выработки энергии.
block.eventide-ev-04-steam-generator.name = Паровой генератор
block.eventide-ev-04-steam-generator.description = Вырабатывает энергию, кипятя воду.
block.eventide-ev-05-razryarost.name = [#55AC60]Razryarost
block.eventide-ev-05-razryarost.description = Он яростно разрушает кристаллы Rybek, высвобождая огромное количество энергии. В процессе образуется жидкий Rybek, чрезвычайно опасный. Если его регулярно не отводить, он может взорваться.
block.eventide-ev-01-soil-filter.name = Фильтр почвы
block.eventide-ev-01-soil-filter.description = Фильтрует почву Изанами, извлекая небольшое количество минералов.
block.eventide-ev-02-charcoal-press.name = Угольный пресс
block.eventide-ev-02-charcoal-press.description = Сжимает уголь под высоким давлением, пока тот не превращается в графит.
block.eventide-ev-03-silicon-casting.name = Литьё кремния
block.eventide-ev-03-silicon-casting.description = Плавит графит, песок и железо в кремний. В качестве побочного продукта производит шлак.
block.eventide-ev-04-glass-furnace.name = Стекловаренная печь
block.eventide-ev-04-glass-furnace.description = Смешивает песок и расплавленные металлы, создавая чрезвычайно прочное стекло.
block.eventide-ev-desintegrator.name = Дезинтегратор
block.eventide-ev-desintegrator.description = Использует энергию, чтобы сжигать поступающие предметы и уничтожать их.
block.eventide-ev-core-dark.name = Ядро: Тьма
block.eventide-ev-core-dark.description = Ядро базы. Бронировано и хранит среднее количество предметов.
block.eventide-ev-iron-box.name = Железный ящик
block.eventide-ev-iron-box.description = Хранит большое количество предметов.
block.eventide-ev-01-gear.name = Gear
block.eventide-ev-01-gear.description = Стремительно обрушивает на врагов шквал пуль.
block.eventide-ev-02-oerlikon.name = Oerlikon
block.eventide-ev-02-oerlikon.description = Зенитная турель. Стреляет по целям осколочными снарядами.
block.eventide-ev-03-nukaton.name = Nukaton
block.eventide-ev-03-nukaton.description = Запускает чрезвычайно мощные управляемые ракеты.
block.eventide-ev-02-welder.name = Welder
block.eventide-ev-02-welder.description = Испускает двойной луч — заряженный энергией и нагретый с помощью шлака.
block.eventide-ev-01-def-dark-rock-wall.name = Стена из тёмного камня
block.eventide-ev-01-def-dark-rock-wall.description = Защищает сооружения от входящего урона.
block.eventide-ev-02-def-large-dark-rock-wall.name = Большая стена из тёмного камня
block.eventide-ev-02-def-large-dark-rock-wall.description = Защищает сооружения от входящего урона.
block.eventide-ev-03-iron-wall.name = Железная стена
block.eventide-ev-03-iron-wall.description = Защищает сооружения от входящего урона.
block.eventide-ev-04-large-iron-wall.name = Большая железная стена
block.eventide-ev-04-large-iron-wall.description = Защищает сооружения от входящего урона.
block.eventide-ev-05-rybek-wall.name = Стена Rybek
block.eventide-ev-05-rybek-wall.description = Защищает сооружения от входящего урона. Замедляет и наносит урон находящимся поблизости врагам, накладывая эффект Gamma.
block.eventide-ev-06-large-rybek-wall.name = Стена Rybek
block.eventide-ev-06-large-rybek-wall.description = Защищает сооружения от входящего урона. Замедляет и наносит урон находящимся поблизости врагам, накладывая эффект Gamma.
item.eventide-ev-charcoal.name = Уголь
item.eventide-ev-charcoal.description = Уголь, образовавшийся из сгоревшей растительности на поверхности Изанами.
item.eventide-ev-dark-glass.name = Тёмное стекло
item.eventide-ev-dark-glass.description = Тёмное стекло, изготовленное из тёмного песка и свинца. Используется при производстве юнитов и сооружений, а также как боеприпас.
item.eventide-ev-dark-rock.name = Тёмный камень
item.eventide-ev-dark-rock.description = Тёмный камень с обугленной поверхности Изанами. Используется в строительстве и производстве базовых материалов.
item.eventide-ev-dark-sand.name = Тёмный песок
item.eventide-ev-dark-sand.description = Тёмный песок с поверхности Изанами. Используется при производстве базовых материалов.
item.eventide-ev-dark-soil.name = Тёмная почва
item.eventide-ev-dark-soil.description = Почва Изанами, почерневшая от воздействия катастрофы. Используется в самых простых конструкциях, но также богата разнообразными минералами.
item.eventide-ev-gold.name = Золото
item.eventide-ev-gold.description = Необработанное золото, найденное в тёмной почве Изанами. Используется в простом строительстве и электронных компонентах; может быть очищено для применения в продвинутом строительстве.
item.eventide-ev-graphite.name = Графит
item.eventide-ev-graphite.description = Графит, изготовленный из угля Изанами. Прочный материал с низкой проводимостью, используемый в строительстве и реакторах, но достаточно прочный и для применения в качестве боеприпаса.
item.eventide-ev-iron.name = Железо
item.eventide-ev-iron.description = Железо, найденное в почве Изанами. Обладает низкой проводимостью, но высокой устойчивостью. Используется в различных строительных проектах и производстве предметов, а также может служить боеприпасом.
item.eventide-ev-lead.name = Свинец
item.eventide-ev-lead.description = Прочный материал, найденный в почве Изанами. Используется в строительстве, реакторах, создании других предметов и даже в качестве боеприпаса.
item.eventide-ev-rybek-crystals.name = Кристаллы Rybek
item.eventide-ev-rybek-crystals.description = Кристаллы с различными свойствами, рассеянные по поверхности Изанами после столкновения с Кагуцучи. Они необходимы почти для любого строительства на Изанами. К сожалению, в необработанном состоянии их применение крайне ограничено, поэтому для более эффективного использования их необходимо перерабатывать.
item.eventide-ev-silicon.name = Кремний
item.eventide-ev-silicon.description = Кремний на Изанами — важнейший компонент конструкций всех уровней, а также производства продвинутых предметов и юнитов.
liquid.eventide-ev-liq-contamined-water.name = Загрязнённая вода
liquid.eventide-ev-liq-contamined-water.description = Вода, которая когда-то была чистой, но теперь загрязнена различными токсичными минералами.
liquid.eventide-ev-liquid-rybek.name = Жидкий Rybek
liquid.eventide-ev-liquid-rybek.description = Эта чрезвычайно горячая и вязкая жидкость образуется при смешивании фрагментов Rybek с загрязнённой водой. Она до десяти раз радиоактивнее и опаснее Rybek в исходном состоянии. Она может повреждать механизмы и причинять вред живым организмам. При неправильной утилизации способна на некоторое время загрязнить территорию.
liquid.eventide-ev-swarm-blood.name = Кровь роя
planet.eventide-izanami.name = Изанами
sector.eventide-19s-01-rebirth.name = Возрождение
sector.eventide-19s-01-rebirth.description = "Начало после конца...
unit.eventide-ev-pigumi.name = Pigumi
unit.eventide-ev-pigumi.description = Небольшой, но практичный юнит ядра. Защищает, строит, добывает ресурсы и ремонтирует повреждённые сооружения.
unit.eventide-ev-gauromydas.name = Gauromydas
unit.eventide-ev-gauromydas.description = Летающий солдат роя. Рождается при определённых условиях во время стадии метаморфоза Citheronia.
unit.eventide-ev-aragog.name = Aragog
unit.eventide-ev-aragog.description = Подростковая особь Aranicidae, выросшая в бойца роя и запускающая во врагов взрывающихся жуков.
unit.eventide-ev-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-aranicidae-nymph.description = Нимфа Aranicidae. Быстра, но сама по себе почти не представляет угрозы. Однако в больших количествах может стать серьёзной проблемой и повреждает сооружения при контакте.
unit.eventide-bettle.name = Bettle
unit.eventide-bettle.description = Рождён, чтобы любить. Обучен взрываться.
unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon
unit.eventide-ev-arthropleura.name = Arthropleura
unit.eventide-ev-arthropleura.description = Молодая королева роя. Она развила чрезвычайно прочный панцирь и толстую кожу, способную выдерживать радиацию. Она постоянно создаёт новых солдат, чтобы те сражались за неё.
unit.eventide-ev-attakus.name = Attakus
unit.eventide-ev-attakus.description = Citheronia, решившая остаться в личиночной форме и последовать по пути королевской линии. Это существо готовится произвести на свет сотни новых личинок, хотя само оно ещё очень молодо.
unit.eventide-ev-citheronia.name = Citheronia
unit.eventide-ev-citheronia.description = Личинка Aranicidae — начальная стадия жизненного цикла этого вида и окончательная стадия, на которой Aranicidae решает, пройти ли метаморфозу или продолжить существование в форме гусеницы.
unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = САМАЯ ВЕРХНЯЯ ИЗ BRAZUKA, МАЛЫШ!
status.eventide-ev-01-planetary-research-result.details = [green] Результаты поиска:\n\n[cyan]> Изанами сформировалась как небольшой каменистый мир, обращающийся вокруг Солнца. На раннем этапе её поверхность была нестабильной и в основном бесплодной, но с течением геологического времени планета остыла, вода накопилась, а атмосфера постепенно стабилизировалась, создав условия, пригодные для жизни...\n\n> Первые организмы появились в водах Изанами в виде примитивных микроорганизмов. За миллионы лет жизнь разнообразилась и приспособилась почти к каждой среде планеты, в конечном итоге сформировав необычайно плотную и сложную биосферу...\n\n> В течение неизвестного периода Изанами оставалась процветающим миром, пока... [red][повреждённые данные]
