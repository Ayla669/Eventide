mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]愛蘭-♡
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] Мир, который не умер...
mod.eventide.description = [#037300[]]Eventide — амбициозный мод, посвящённый созданию новой кампании с собственной уникальной историей. Действие происходит на планете, которая когда-то была наполнена богатой и древней жизнью, но после масштабной катастрофы превратилась в безжизненную пустошь (хотя жизнь на ней не исчезла полностью). Планета богата ценными минералами и населена многочисленными, крайне территориальными формами жизни.\n\n[#FF0000[]]Примечание: мод всё ещё находится на ранней стадии разработки; в будущем многое может измениться: спрайты, звуки, враги, история и многое другое.\n\n[#83C0E4[]]Участники:\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] Это всё ещё демо.
block.eventide-ev-01-dark-duct.name = Тёмный канал
block.eventide-ev-01-dark-duct.description = Перемещает предметы с помощью отрицательного давления.
block.eventide-ev-02-dark-junction.name = Тёмное соединение
block.eventide-ev-02-dark-junction.description = Позволяет пересекать два канала.
block.eventide-ev-03-dark-router.name = Тёмный распределитель
block.eventide-ev-03-dark-router.description = Изготовлен из тёмного камня. Равномерно распределяет поступающие из каналов предметы в трёх направлениях.
block.eventide-ev-04-dark-duct-bridge.name = Мост тёмных каналов
block.eventide-ev-04-dark-duct-bridge.description = Служит мостом для пересечения каналов или участков местности.
block.eventide-ev-05-duct-sorter.name = Сортировщик каналов
block.eventide-ev-05-duct-sorter.description = Если поступивший предмет соответствует выбранному, он проходит вперёд. В противном случае он выводится по бокам.
block.eventide-ev-06-duct-sorter-inverted.name = Инвертированный сортировщик каналов
block.eventide-ev-06-duct-sorter-inverted.description = Работает как сортировщик каналов, но выводит выбранные предметы по бокам, а не прямо вперёд.
block.eventide-ev-07-duct-overflow-controller.name = Тёмный контроллер переполнения
block.eventide-ev-07-duct-overflow-controller.description = Выводит предметы по бокам, если путь впереди заблокирован.
block.eventide-ev-08-duct-underflow-controller.name = Тёмный контроллер недоподачи
block.eventide-ev-08-duct-underflow-controller.description = Работает как контроллер переполнения, но наоборот.
block.eventide-ev-09-dark-unloader.name = Тёмный разгрузчик
block.eventide-ev-09-dark-unloader.description = Направленный разгрузчик.
block.eventide-ev-01-dark-drill.name = Тёмный бур
block.eventide-ev-01-dark-drill.description = Базовый бур, предназначенный для добычи ресурсов из почвы Изанами.
block.eventide-ev-02-iron-drill.name = Железный бур
block.eventide-ev-02-iron-drill.description = Хороший бур, предназначенный для более быстрой добычи ресурсов.
block.eventide-ev-03-multi-drill.name = Мультибур
block.eventide-ev-03-multi-drill.description = Продвинутый бур, предназначенный для добычи твёрдых ресурсов из почвы.
