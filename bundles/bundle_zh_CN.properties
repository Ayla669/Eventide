block.eventide-ev-05-razryarost.name = [#55AC60]Razryarost
block.eventide-ev-05-razryarost.description = 猛烈摧毁 Rybek 晶体，释放巨量能量。这个过程会产生极其危险的液态 Rybek。如果不经常排出，可能发生爆炸。
block.eventide-ev-01-soil-filter.name = 土壤过滤器
block.eventide-ev-01-soil-filter.description = 过滤伊邪那美的土壤，以少量提取其中的矿物。
block.eventide-ev-02-charcoal-press.name = 木炭压制机
block.eventide-ev-02-charcoal-press.description = 在高压下压碎木炭，直到其转化为石墨。
block.eventide-ev-03-silicon-casting.name = 硅铸造机
block.eventide-ev-03-silicon-casting.description = 将石墨、沙和铁熔炼成硅，同时产生矿渣副产物。
block.eventide-ev-04-glass-furnace.name = 玻璃熔炉
block.eventide-ev-04-glass-furnace.description = 将沙与熔融金属混合，制成极其坚固的玻璃。
block.eventide-ev-desintegrator.name = 分解器
block.eventide-ev-desintegrator.description = 利用电力焚烧输入其中的物品并将其摧毁。
