item.eventide-ev-charcoal.name = 木炭
item.eventide-ev-charcoal.description = 由伊邪那美地表焚化后的植物生命形成的木炭。
item.eventide-ev-dark-glass.name = 深色玻璃
item.eventide-ev-dark-glass.description = 由深色沙和铅制成的深色玻璃。用于制造单位和建筑，也可作为弹药。
item.eventide-ev-dark-rock.name = 深色岩石
item.eventide-ev-dark-rock.description = 来自伊邪那美焦黑地表的深色岩石。用于建筑以及基础材料的制造。
item.eventide-ev-dark-sand.name = 深色沙
item.eventide-ev-dark-sand.description = 来自伊邪那美地表的深色沙。用于制造基础材料。
item.eventide-ev-dark-soil.name = 深色土壤
item.eventide-ev-dark-soil.description = 伊邪那美的黑化土壤。用于非常基础的建筑，同时富含多种矿物。
item.eventide-ev-gold.name = 黄金
item.eventide-ev-gold.description = 在伊邪那美深色土壤中发现的原金。用于基础建筑和电子元件制造，也可精炼后用于高级建筑。
item.eventide-ev-graphite.name = 石墨
item.eventide-ev-graphite.description = 由伊邪那美木炭制成的石墨。一种坚固且低导电性的材料，用于建筑和反应堆，同时也足够坚韧，可作为弹药。
item.eventide-ev-iron.name = 铁
item.eventide-ev-iron.description = 在伊邪那美土壤中发现的铁。导电性低，但耐受性极强。用于各种建筑和物品制造，也可作为弹药。
item.eventide-ev-lead.name = 铅
item.eventide-ev-lead.description = 铅，一种在伊邪那美土壤中发现的坚固材料。可用于建筑、反应堆、其他物品的制造，甚至可作为弹药。
item.eventide-ev-rybek-crystals.name = Rybek 晶体
item.eventide-ev-rybek-crystals.description = 具有多种性质的晶体。在与迦具土发生碰撞后，它们散落于伊邪那美表面。几乎所有伊邪那美上的建筑都需要它们。不幸的是，它们未经加工时用途极其有限，必须经过精炼才能发挥更好的作用。
item.eventide-ev-silicon.name = 硅
item.eventide-ev-silicon.description = 伊邪那美的硅是各级建筑以及高级物品和单位制造中不可或缺的材料。
liquid.eventide-ev-liq-contamined-water.name = 污染水
liquid.eventide-ev-liq-contamined-water.description = 曾经清澈的水，如今被各种有毒矿物污染。
liquid.eventide-ev-liquid-rybek.name = Liquid Rybek
liquid.eventide-ev-liquid-rybek.description = 将 Rybek 碎片与污染水混合后产生的液体。它温度极高且十分黏稠，放射性和危险性最高可达原始 Rybek 的十倍。它会损坏机械并伤害生命体。如果处理不当，还会使区域在一段时间内受到污染。
liquid.eventide-ev-swarm-blood.name = 群体之血
planet.eventide-izanami.name = Izanami
sector.eventide-19s-01-rebirth.name = 重生
sector.eventide-19s-01-rebirth.description = "终结之后的开始……
unit.eventide-ev-pigumi.name = Pigumi
unit.eventide-ev-pigumi.description = 一种小型但实用的核心单位。它能够防御、建造、采矿并修复受损建筑。
unit.eventide-ev-gauromydas.name = Gauromydas
unit.eventide-ev-gauromydas.description = 一种群体的飞行士兵。在 Citheronia 的变态阶段，于特定条件下诞生。
unit.eventide-ev-aragog.name = Aragog
unit.eventide-ev-aragog.description = 一只成长为群体战士的年轻 Aranicidae，会向敌人发射爆炸性甲虫。
unit.eventide-ev-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-aranicidae-nymph.description = Aranicidae 科的一种若虫。它速度很快，但单独行动时几乎没有威胁。然而，大量聚集时会成为严重的问题，并会损坏与其接触的建筑。
unit.eventide-bettle.name = Bettle
unit.eventide-bettle.description = 因爱而生。为爆炸而训练。
unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon
unit.eventide-ev-arthropleura.name = Arthropleura
unit.eventide-ev-arthropleura.description = 一只年轻的群体女王。她拥有极其坚韧的甲壳和厚实的皮肤，能够抵抗辐射。她会不断产生新的士兵为自己作战。
unit.eventide-ev-attakus.name = Attakus
unit.eventide-ev-attakus.description = 一只选择保持幼体形态、走上王族之路的 Citheronia。这种生物正准备诞下数百只新的幼体，尽管它仍然十分年幼。
unit.eventide-ev-citheronia.name = Citheronia
unit.eventide-ev-citheronia.description = 一种 Aranicidae 幼体，是该物种生命周期的初始阶段，也是 Aranicidae 决定进行变态还是继续保持毛虫形态的关键阶段。
unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = 巴西佬的顶流宝贝！
status.eventide-ev-01-planetary-research-result.details = [green] 搜索结果：\n\n[cyan]> 伊邪那美最初形成于一颗环绕太阳运行的小型岩质世界。早期地表并不稳定，且大部分地区荒芜贫瘠；但随着地质时间推移，星球逐渐冷却，水开始积聚，大气也逐渐稳定，为生命创造了适宜的条件……\n\n> 最初的生物以原始微生物的形式出现在伊邪那美的水域中。经过数百万年的演化，生命逐渐分化，并适应了星球上几乎所有的环境，最终形成了异常稠密而复杂的生物圈……\n\n> 在一段未知的时期内，伊邪那美一直是一个繁荣的世界，直到……[red][corrupted data]
