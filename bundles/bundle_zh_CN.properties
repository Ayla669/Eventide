mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]愛蘭-♡
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] 一个不死的世界……
mod.eventide.description = [#037300[]]Eventide 是一个雄心勃勃的模组，专注于打造拥有独特世界观的新战役。故事发生在一颗曾经孕育着繁盛而悠久生命的星球上。一次巨大的灾难使它化为荒芜之地，但生命并未因此彻底消失。星球蕴藏着丰富的珍贵矿物，并栖息着大量领地意识极强的生命形态。\n\n[#FF0000[]]注意：本模组仍处于早期开发阶段；未来许多内容都可能发生变化，例如贴图、音效、敌人、世界观等。\n\n[#83C0E4[]]贡献者：\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] It's still a demo.
