item.eventide-ev-charcoal.name = 木炭
item.eventide-ev-charcoal.description = 炭化したイザナミの植物の成れの果て。
item.eventide-ev-dark-glass.name = 黒いガラス
item.eventide-ev-dark-glass.description = 黒砂と鉛から作られる、暗色のガラス。ユニットや建造物の材料、または弾薬として使われる。
item.eventide-ev-dark-rock.name = 黒岩
item.eventide-ev-dark-rock.description = イザナミの焦土を構成する黒い石。建材や、基本的な材料の製造に使われる。
item.eventide-ev-dark-sand.name = 黒砂
item.eventide-ev-dark-sand.description = イザナミの表面から採れる黒い砂。基本的な材料の製造に使われる。
item.eventide-ev-dark-soil.name = 黒い土
item.eventide-ev-dark-soil.description = イザナミの焦土。とても簡易的な建造物に使われるが、様々な鉱物を含む。
item.eventide-ev-gold.name = 金
item.eventide-ev-gold.description = イザナミの土壌から抽出された金の塊。基本的な建造物や電子回路に使われるが、精製することでより高度な建造物に利用できるようになる。
item.eventide-ev-graphite.name = 黒鉛
item.eventide-ev-graphite.description = イザナミの木炭を圧縮して製造した黒鉛。耐久性が高く、導電性が低いため建材または弾薬として使われる。
item.eventide-ev-iron.name = 鉄
item.eventide-ev-iron.description = イザナミの地中に存在する鉄。導電性は低いが耐久性は高い。様々な建造物に建材として、または加工された材料の原料として、そして弾薬としても使われる。
item.eventide-ev-lead.name = 鉛
item.eventide-ev-lead.description = イザナミの地中に存在する、耐久性が高い物質である鉛。建造物の建材や、加工された材料の原料、そして弾薬としてさえも使える。
item.eventide-ev-rybek-crystals.name = リベクの結晶
item.eventide-ev-rybek-crystals.description = カグツチとの衝突の後、イザナミの表面に様々な特性を持つ、放射性の結晶質が散乱された。イザナミにおけるほぼすべての建造に必要とされるが、自然に存在する形態の用途は限られ、より高度な用途での利用のためには精製する必要がある。
item.eventide-ev-silicon.name = シリコン
item.eventide-ev-silicon.description = イザナミにおいてシリコンはありとあらゆる場面での建築と、高度な材料やユニットの製造に必須な要素である。
liquid.eventide-ev-liq-contamined-water.name = 汚染された水
liquid.eventide-ev-liq-contamined-water.description = 様々な毒性のある溶質で汚染された水。昔はきれいだった。
liquid.eventide-ev-liquid-rybek.name = 液体のリベク
liquid.eventide-ev-liquid-rybek.description = 汚染水とリベク片を混ぜて生成される、自然な形態のリベクより最大10倍ほど放射性が高い、高温で稠度が高い液体。機械や生物に損傷をもたらす危険があり、不用意な廃棄は小さい範囲をある程度の期間汚染する。
liquid.eventide-ev-swarm-blood.name = 大群の血
