mod.eventide.name = 黄昏
mod.eventide.author = [#FC00EB[]]愛蘭-♡
mod.eventide.displayName = [#21FFC5[]]黄昏
mod.eventide.subtitle = [#424B99[]] とある瀕死の惑星にて...
mod.eventide.description = [#037300[]]「黄昏」は独自のストーリーを持った新たなキャンペーンを作ることを主とした、大きな構想を持ったMODです。舞台である惑星イザナミは、かつて生命であふれていましたが、ある大規模な災害により、生命は生き残ったものの、荒廃した不毛の星となってしまいました。この価値ある資源に満ちた惑星には現在、様々な非常に縄張り意識が強い生命体が生息しています。\n\n[#FF0000[]]注：このMODは現在開発初期の状態にあります。将来グラフィック、音、敵、ストーリーなど様々な物に変更が加えられるかもしれません。\n\n[#83C0E4[]]貢献者たち:\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] It's still a demo.
