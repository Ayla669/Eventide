unit.eventide-ev-pigumi.name = ピグミー
unit.eventide-ev-pigumi.description = 小さいが実用的なコアユニット。建築、採掘、そして建造物の修理ができる。
unit.eventide-ev-gauromydas.name = ガウロミダス
unit.eventide-ev-gauromydas.description = 大群の空飛ぶ歩(?)兵。キテロニアの変態過程で、特定の条件下で生まれる。
unit.eventide-ev-aragog.name = アラゴグ
unit.eventide-ev-aragog.description = 大群の戦闘員であるクモ様の生物。ビートルを敵に向かって投射する。
unit.eventide-ev-aranicidae-nymph.name = アラクナカナ
unit.eventide-ev-aranicidae-nymph.description = クモ様生物の幼体。高速で、個体あたりの危険度は低いが、多数出現した場合は注意が必要。接触した建造物を損傷させる。
unit.eventide-bettle.name = ビートル
unit.eventide-bettle.description = こいつの存在意義はバクハツすることである。
unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon
unit.eventide-ev-arthropleura.name = アルスロプレウラ
unit.eventide-ev-arthropleura.description = 大群の女王の亜成体である。非常に堅い甲殻と表皮を持ち、これらは傷害や放射線を防ぐ。新たな大群の虫たちを産む。
unit.eventide-ev-attakus.name = アタカス
unit.eventide-ev-attakus.description = キテロニアが変態する代わりに女王に発達する過程における幼体。この時期から既に大量の幼虫を産む準備が始まっている。
unit.eventide-ev-citheronia.name = キテロニア
unit.eventide-ev-citheronia.description = クモ様生物の幼虫。この種のライフサイクルの始点であり、個体が変態するかが決定される段階。
unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = THE TOP ONE FROM BRAZUKA BABY!
status.eventide-ev-01-planetary-research-result.details = [green] 検索結果：\n\n[cyan]>イザナミは小さな岩石質の惑星として形成した。初期の地殻は不安定で荒れていたが、惑星が冷却するにつれ表面に水が存在するようになり、大気も安定化し、氏名に適した環境が生まれた。\n\n>最初の生命体はイザナミの海に生成した、原始的な微生物であった。地質学的時間をかけて、生命は適応し、多様化し、惑星のほぼ全域へと広がり、かなり複雑な生態系を形成した。\n\n>ある程度の間、イザナミは命の星であったが...[red][データ破損]
