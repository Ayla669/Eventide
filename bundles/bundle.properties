# Research

status.eventide-ev-research-results-0.name = [green]>[scarlet]The Swarm
status.eventide-ev-research-results-0.description = [green]>[cyan]A hostile insectoid life form that lives underground and emerges to the surface in search of food and resources to build its nests, or whenever it senses a threat within its territory.\n\n[green]>[cyan]It follows a hierarchy similar to that of other colonial insectoids, by all indications, there is someone at the top issuing orders.\n\n[green]>[cyan]It is strange that organic life exists on Izanami... We had believed the planet to be uninhabited...
status.eventide-ev-research-results-1.name = [green]>[cyan]Protogenic Era
status.eventide-ev-research-results-1.description = [green]>4.8–4.4 billion years ago:\n\n[cyan]> Izanami formed approximately 4.8 billion years ago through the gradual accumulation of dust and rocky fragments. For millions of years, frequent collisions and internal heat kept its surface covered in magma.\n\n> Over time, the planet began to cool, allowing a primitive crust to form. Intense volcanic activity released vast quantities of gases, creating a dense and toxic atmosphere.\n\n> As temperatures continued to drop, atmospheric water vapor condensed, causing prolonged rainfall. Water accumulated on the surface, forming Izanami's first oceans and bringing the Protogenic Era to an end after approximately 400 million years.
status.eventide-ev-research-results-2.name = [green]>[cyan]Biogonic Era
status.eventide-ev-research-results-2.description = [green]>4.4–3.8 billion years ago:\n\n[cyan]> Analysis of geothermal gases and water samples from Izanami revealed evidence of the earliest stages of its biological development.\n\n> Following the formation of the oceans, the first unicellular organisms emerged, sustained by chemical and biochemical reactions. Over hundreds of millions of years, these life forms diversified, establishing the first marine ecosystems.\n\n> Gradually, biological activity spread throughout the oceans, occupying different environments and transforming their chemical properties. Thus, Izanami ceased to be merely a geologically active world and became a living planet.

