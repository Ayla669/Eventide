block.eventide-ev-03-iron-wall.description = Protects structures from incoming damage.
block.eventide-ev-04-large-iron-wall.name = Large Iron Wall
block.eventide-ev-04-large-iron-wall.description = Protects structures from incoming damage.
block.eventide-ev-05-rybek-wall.name = Rybek Wall
block.eventide-ev-05-rybek-wall.description = Protects structures from incoming damage. Slows and deals damage to nearby enemies, applying the Gamma effect.
block.eventide-ev-06-large-rybek-wall.name = Rybek Wall
block.eventide-ev-06-large-rybek-wall.description = Protects structures from incoming damage. Slows and deals damage to nearby enemies, applying the Gamma effect.
item.eventide-ev-charcoal.name = Charcoal
item.eventide-ev-charcoal.description = Charcoal formed from the incinerated plant life on the surface of Izanami.
item.eventide-ev-dark-glass.name = Dark Glass
item.eventide-ev-dark-glass.description = Dark glass made from dark sand and lead. Used in the manufacture of units and structures, and also used as ammunition.
item.eventide-ev-dark-rock.name = Dark Rock
item.eventide-ev-dark-rock.description = A dark rock from the charred surface of Izanami. Used in construction and the manufacture of basic materials.
item.eventide-ev-dark-sand.name = Dark Sand
item.eventide-ev-dark-sand.description = Dark sand from the surface of Izanami. Used in the manufacture of basic materials.
item.eventide-ev-dark-soil.name = Dark Soil
item.eventide-ev-dark-soil.description = Izanami blackened soil. Used in very basic constructions, but also rich in a wide variety of minerals.
item.eventide-ev-gold.name = Gold
item.eventide-ev-gold.description = Raw gold found in the dark soil of Izanami. Used for basic construction and electronic components (can be refined for use in advanced construction).
item.eventide-ev-graphite.name = Graphite
item.eventide-ev-graphite.description = Graphite manufactured from Izanami charcoal. A durable, low-conductivity material used in construction and reactors, yet strong enough to serve as ammunition.
item.eventide-ev-iron.name = Iron
item.eventide-ev-iron.description = Iron found in the soil of Izanami. It has low conductivity but is highly resistant. Used in a variety of construction projects and item manufacturing, it can also serve as ammunition.
item.eventide-ev-lead.name = Lead
item.eventide-ev-lead.description = Lead, a durable material found in the soil of Izanami. It can be used in construction, reactors, the crafting of other items, and even as ammunition.
item.eventide-ev-rybek-crystals.name = Rybek Crystals
item.eventide-ev-rybek-crystals.description = Crystals with various properties that were scattered across the surface of Izanami following the collision with Kagutsuchi. They are required for almost all construction on Izanami. Unfortunately, in their raw state, they are extremely limited in utility and must be refined for better applications.
item.eventide-ev-silicon.name = Silicon
item.eventide-ev-silicon.description = Silicon in Izanami is an essential component for constructions of all levels and for the manufacture of advanced items and units.
liquid.eventide-ev-liq-contamined-water.name = Contamined Water
liquid.eventide-ev-liq-contamined-water.description = Water that was once clean, now contaminated by various toxic minerals.
liquid.eventide-ev-liquid-rybek.name = Liquid Rybek
liquid.eventide-ev-liquid-rybek.description = Produced by mixing Rybek fragments with contaminated water, this extremely hot and viscous liquid is up to ten times more radioactive and dangerous than Rybek in its raw form. It can damage machinery and harm living beings in the process. It can contaminate an area for a certain period if disposed of incorrectly.
liquid.eventide-ev-swarm-blood.name = Swarm Blood
planet.eventide-izanami.name = Izanami
sector.eventide-19s-01-rebirth.name = Rebirth
sector.eventide-19s-01-rebirth.description = The beginning after the end. Discover what you can about Izanami. Research new technologies and protect yourself against the swarm.
unit.eventide-ev-pigumi.name = Pigumi
unit.eventide-ev-pigumi.description = A small but practical core unit. It protects, builds, mines, and repairs damaged structures.
unit.eventide-ev-gauromydas.name = Gauromydas
unit.eventide-ev-gauromydas.description = A flying soldier of the swarm. Born under specific conditions during the citheronia's metamorphosis phase.
unit.eventide-ev-aragog.name = Aragog
unit.eventide-ev-aragog.description = An adolescent Aranicidae that grew up to become a swarm fighter, launching explosive beetles at enemies
unit.eventide-ev-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-aranicidae-nymph.description = A nymph of the Aranicidae family. It is fast but poses almost no threat on its own. However, it can become a major problem in large numbers, damages structures in contact.
unit.eventide-bettle.name = Bettle
unit.eventide-bettle.description = Born to love. Trained to explode.
unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon
unit.eventide-ev-arthropleura.name = Arthropleura
unit.eventide-ev-arthropleura.description = A young swarm queen, she has developed an extremely resilient carapace and thick skin capable of withstanding radiation. She constantly generates new soldiers to fight for her.
unit.eventide-ev-attakus.name = Attakus
unit.eventide-ev-attakus.description = A citheronia that chose to remain in its larval form, following the path of royalty. This creature is preparing to give birth to hundreds of new larvae, though it is still very young.
unit.eventide-ev-citheronia.name = Citheronia
unit.eventide-ev-citheronia.description = An Aranicidae larva, the initial stage of this species' life cycle, and the definitive stage where the Aranicidae decides whether to undergo metamorphosis or continue as a caterpillar.
unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = THE TOP ONE FROM BRAZUKA BABY!
status.eventide-ev-01-planetary-research-result.name = Planetary research results
status.eventide-ev-01-planetary-research-result.details = [green] Search results:\n\n[cyan]> Izanami formed as a small rocky world orbiting the Sun. Its early surface was unstable and largely barren, but over geological time the planet cooled, water accumulated, and its atmosphere gradually stabilized, creating conditions suitable for life...\n\n> The first organisms emerged in Izanami's waters as primitive microorganisms. Over millions of years, life diversified and adapted to nearly every environment on the planet, eventually forming an unusually dense and complex biosphere...\n\n> For an unknown period, Izanami remained a thriving world until...[red][corrupted data]

