liquid.eventide-ev-liq-05-liquid-rybek.description = [green]>[cyan]Produced by mixing Rybek fragments with contaminated water, this extremely hot and viscous liquid is up to ten times more radioactive and dangerous than Rybek in its raw form. It can damage machinery and harm living beings in the process. It can contaminate an area for a certain period if disposed of incorrectly.
