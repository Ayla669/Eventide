# Mod
mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]Aira
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] This Planet is Mine
mod.eventide.description = [#037300[]]Eventide is an ambitious mod focused on creating a new campaign with its own unique lore.\n\nIt takes place on a planet that once teemed with abundant, long-standing life but became a desolate wasteland following a massive catastrophe (though not one devoid of life).\n\nThe planet is rich in valuable minerals and inhabited by numerous, extremely territorial life-forms.\n\n[#FF0000[]]Note: The mod is still in early development; many things may change in the future, such as sprites, sounds, enemies, lore, etc.\n\nArachnophobia warning for sensitive individuals.\n\n[#83C0E4[]]Eventide is available in the following languages:\n\n-English\n-Português Brasileiro\n-Italiano\n-Deutsch\n-Русский\n-Français\n-Español\n-日本語\n-简体中文\n\nIf you would like to contribute to the mod in any way, join our Discord server.
mod.eventide.version = [cyan] 0.1

# //Campanha//

# textos da campanha

rebirth.instructions = [green]>[cyan]Read your instructions in the core
rebirth.welcome = [green]>[cyan]Welcome to Izanami\n\n[green]>[cyan]Your objective on this planet is to discover as much as possible about its history and resources\n in order to establish a base and extract those resources
rebirth.basics = [green]>[cyan]Let’s stick to the basics for now, mine some [#424B99]dark rock[] by clicking on it\n\n[green]>[cyan]Use [WASD] to move, or simply drag your finger across the screen
rebirth.dark.rock.text = [green]>[#424B99]dark rock[] [cyan]is a durable and malleable material, perfect for construction
rebirth.tech.tree = [green]>[cyan]Open the \ue875 tech tree, research the Dark Drill, and place it over the [#424B99]dark rock[]  to mine it automatically
rebirth.duct = [green]>[cyan]Research ducts and use them to transport resources to the core
rebirth.expand.mining = [green]>[#475757]iron[][cyan] is also very useful and necessary for more complex construction projects\n\n[green]>[cyan]Expand your mining operations
rebirth.explore = [green]>[cyan]Explore the area and extract some resources
rebirth.vaporflow = [green]>[cyan]Research the vaporflow and place it over a vent to generate some power
rebirth.drone.factory = [green]>[cyan]Research for the radar drone factory to explore the area
rebirth.iron.node = [green]>[cyan]Research and build the iron node to bring power to the factory
rebirth.note = [green]>[cyan]Note: Although iron is a conductive material\nit ends up losing a significant amount of energy along the way\n so build your electrical networks with care

rebirth.warning = [scarlet]⚠︎ Hostile life forms detected ⚠︎

rebirth.swarm = [green]>[scarlet]Life forms [cyan] can overcome barriers, but they prefer to follow an unobstructed path\n\n[green]>[cyan]Therefore, use walls to create routes that enemies will choose to follow
rebirth.good.luck = [green]>[cyan]Protect the [yellow]core
rebirth.command = [green]>[cyan]Use Shift + Left Click or press Command Mode button to select a unit, drag to select multiple units\nClick where you want to them go
rebirth.ammo = [green]>[cyan]Build an drill and take some ammo for your turrets using ducts
rebirth.hostil = [green]>[scarlet]Hostil life forms approaching

# setores

# <<Principais>>

sector.eventide-19s-01-rebirth.name = Rebirth
sector.eventide-19s-01-rebirth.description = [green]>[cyan]The starting point for our new base\n\n[green]>[cyan]Research about Izanami so that we can establish a planetary\nbase and extract the planet's resources

sector.eventide-19s-02-brood.name = Brood
sector.eventide-19s-02-brood.description = [green]>[cyan]The encounter with an organic life form in the first\nsector was unexpected, the planet was supposed to be uninhabited.\n\n[green]>[cyan]Sensors have detected irregular movement in this sector,slight, yet\nirregular, which could indicate the presence of a significant number\nof these creatures, however, the terrain is extremely narrow, making\nit potentially difficult to establish a base here.\n\n[green]>[cyan]Find out everything you can about our new "problem" and research\nnew ways to defend against these creatures.

sector.eventide-19s-03-thermal-basin.name = Thermal Basin
sector.eventide-19s-03-thermal-basin.description = [green]>[cyan]The discovery of a hostile life form on this planet makes\nour mission challenging from this point forward.\n\n[green]>[cyan]This sector has high geothermal activity, which could be useful\nfor researching new weapons and energy sources.

# <<Opcionais>>

sector.eventide-20s-01-petrichor.name = Petrichor
sector.eventide-20s-01-petrichor.description = [green]>[cyan]There is a river running through this area, due to frequent\nrains, the current has brought a significant amount of iron\nto the riverbank\n\n[orange]<Optional Sector>\n\n[scarlet]> All units deal +20% damage

sector.eventide-20s-02-badlands.name = Badlands
sector.eventide-20s-02-badlands.description = [green]>[cyan]A desolate location with a high concentration of iron\n\n[orange]<Optional Sector>\n\n[scarlet]> Block Health -20%\n[scarlet]> Build speed -20%\n[scarlet]> All units deal +20% damage

sector.eventide-20s-03-carapace.name = Carapace
sector.eventide-20s-03-carapace.description = [green]>[cyan]The landing zone in this sector is quite unfavorable, however,\non the opposite side, there are abundant resources that we need.\n\n[orange]<Optional Sector>\n\n[scarlet]> Build Cost +50%\n[scarlet]> All units deal +50% damage\n[scarlet]> Build Speed -50%

sector.eventide-20s-04-burrow.name = Burrow
sector.eventide-20s-04-burrow.description = [green]>[cyan]This sector contains a good amount of charcoal, which is\nessential for our research, however, there are two nest exits\non opposite sides of the area, have caution.\n\n[orange]<Optional Sector>\n\n[scarlet]> Build Cost +20%\n[scarlet]> All units deal +50% damage

sector.eventide-20s-05-fumarole.name = Fumarole
sector.eventide-20s-05-fumarole.description = [green]>[cyan]An area rich in resources, however, sensors have detected high\nenemy activity, perhaps the swarm is drawn to this area because\nof its intense heat.\n\n[orange]<Optional Sector>\n\n[scarlet]> Block Health -50%\n[scarlet]> All units deal +100% damage

sector.eventide-20s-06-abyss.name = Abyss
sector.eventide-20s-06-abyss.description = [green]>[cyan]This sector contains a large deposit of rybek, but movement\nand construction are difficult due to a giant hole in the\nmiddle of the sector that leads down into the depths of\nthe planet.\n\n[orange]<Optional Sector>\n\n[scarlet]> Build cost +100%\n[scarlet]> All units deal +100% damage
