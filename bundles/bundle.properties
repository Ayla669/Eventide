unit.eventide-ev-dr-radar-drone.name = Radar Drone
unit.eventide-ev-dr-radar-drone.description = [green]>[cyan]A drone that scans its surrounding environment, it is fast but extremely fragile. Slows down enemies, heal allies, and emits a signal when it detects threats.

