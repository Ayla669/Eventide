item.eventide-ev-a07-rybek-crystals.description = [green]>[cyan]A crystal seemingly from off-planet, extremely radioactive and resistant, might perhaps be refined for more advanced uses.
item.eventide-ev-a08-charcoal.name = [#3A3A3A]Charcoal[]
item.eventide-ev-a08-charcoal.description = [green]>[cyan]Charcoal formed from burnt organic matter.
