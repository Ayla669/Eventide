# Swarm units

unit.eventide-ev-unt-crw-c01-citheronia.name = Citheronia
unit.eventide-ev-unt-crw-c01-citheronia.description = [green]>[cyan]Apparently the first stage of the swarm's life. It has a tough outer shell to protect itself while it is still slow and lacks any defenses.
unit.eventide-ev-unt-leg-c01-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-unt-leg-c01-aranicidae-nymph.description = [green]>[cyan]A mature form of the Citheronia, swift and small, it sheds its rigid carapace during metamorphosis, while not much of a threat on its own, it becomes a massive problem in large numbers.
unit.eventide-ev-unt-crw-c02-attakus.name = Attakus
unit.eventide-ev-unt-crw-c02-attakus.description = [green]>[cyan]A citheronia that did not undergo the metamorphosis process appears to be heading down a different path, its outer shell is much thicker, and carries with it several larvae from the swarm.
unit.eventide-ev-unt-leg-c02-brachitus.name = Brachitus
unit.eventide-ev-unt-leg-c02-brachitus.description = [green]>[cyan]A mature aracnacana, possessing a tougher carapace and exceptionally hot blood. Its internal pressure is high enough to allow it to shoot its own blood at its enemies.
unit.eventide-ev-unt-crw-c03-arthropleura.name = Arthropleura
unit.eventide-ev-unt-crw-c03-arthropleura.description = [green]>[cyan]A supposed swarm queen, she possesses an extremely tough carapace and constantly produces new soldiers to defend herself... though it seems she has yet to reach her prime.
unit.eventide-ev-unt-leg-c03-aragog.name = Aragog
unit.eventide-ev-unt-leg-c03-aragog.description = [green]>[cyan]A swarm warrior. These soldiers possess extremely hard carapaces and carry with them several explosive beetles, which they launch at enemies from a long distance.
unit.eventide-ev-unt-fly-c02-gauromydas.name = Gauromydas
unit.eventide-ev-unt-fly-c02-gauromydas.description = [green]>[cyan]A flying soldier of the swarm. Born under specific conditions during the citheronia's metamorphosis phase.

