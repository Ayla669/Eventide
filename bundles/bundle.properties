block.eventide-ev-05-razryarost.name = [#55AC60]Razryarost
block.eventide-ev-05-razryarost.description = It violently destroys Rybek Crystals, releasing massive amounts of power. The process produces liquid rybek, which is extremely dangerous. If it is not drained frequently, it can explode.
block.eventide-ev-01-soil-filter.name = Soil Filter
block.eventide-ev-01-soil-filter.description = Filters Izanami soil to extract minerals in small quantities.
block.eventide-ev-02-charcoal-press.name = Charcoal Press
block.eventide-ev-02-charcoal-press.description = Crushes charcoal at high pressures until it turns into graphite.
block.eventide-ev-03-silicon-casting.name = Silicon Casting
block.eventide-ev-03-silicon-casting.description = Melts graphite, sand, and iron into silicon. Produces slag as a by-product.
block.eventide-ev-04-glass-furnace.name = Glass Furnace
block.eventide-ev-04-glass-furnace.description = Mixes sand and molten metals into an extremely durable glass.
block.eventide-ev-desintegrator.name = Desintegrator
block.eventide-ev-desintegrator.description = Uses power to burn items inputted into it and destroy them.
block.eventide-ev-core-dark.name = Core: Dark
block.eventide-ev-core-dark.description = Core of the base. Armored and stores a medium amount of items.
block.eventide-ev-iron-box.name = Iron Box
block.eventide-ev-iron-box.description = Stores items in larger quantities.
block.eventide-ev-01-gear.name = Gear
block.eventide-ev-01-gear.description = Rapidly blasts bullets at enemies.
block.eventide-ev-02-oerlikon.name = Oerlikon
block.eventide-ev-02-oerlikon.description = An anti-aircraft turret. It fires fragmentation rounds at targets.
block.eventide-ev-03-nukaton.name = Nukaton
block.eventide-ev-03-nukaton.description = Launches extremely powerful guided missiles.
block.eventide-ev-02-welder.name = Welder
block.eventide-ev-02-welder.description = Fires a dual beam—energized and heated with slag.
