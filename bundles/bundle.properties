mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]Aira <愛蘭>
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] An undead world...
mod.eventide.description = [#037300[]]Eventide is an ambitious mod focused on creating a new campaign with its own unique lore. It takes place on a planet that once teemed with abundant, long-standing life but became a desolate wasteland following a massive catastrophe (though not one devoid of life). The planet is rich in valuable minerals and inhabited by numerous, extremely territorial life-forms.\n\n[#FF0000[]]Note: The mod is still in early development; many things may change in the future, such as sprites, sounds, enemies, lore, etc.\n\n[#83C0E4[]]Contributors:\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] It's still a demo.
