item.eventide-ev-a09-graphite.description = [green]>[cyan]A heavy and dense material, conductive and resistant, used in various fields.
item.eventide-ev-a10-silicon.name = [#79799D]Silicon[]
item.eventide-ev-a10-silicon.description = [green]>[cyan]A highly flexible and durable conductor, used in complex constructions and in the creation of units.
item.eventide-ev-a11-dark-glass.name = [#3E00D1]Dark Glass[]
item.eventide-ev-a11-dark-glass.description = [green]>[cyan]An extremely resistant type of glass, used in various complex structures and units.
item.eventide-ev-b01-chitin.name = [#163A7C]Chitin[]
item.eventide-ev-b01-chitin.description = [green]>[cyan]Nutrients hardened and compacted into a tough membrane, used in construction, in factories, and also as ammunition.
item.eventide-ev-b02-hardened-chitin.name = [#14223E]Hardened Chitin[]
item.eventide-ev-b02-hardened-chitin.description = [green]>[cyan]Aged chitin, drier, tougher, and extremely dense, used in advanced manufacturing and as ammunition.
item.eventide-ev-b03-carotenoid.name = [#00E9FF]Carotenoid[]
item.eventide-ev-b03-carotenoid.description = [green]>[cyan]A resource used to store the spores of the umbramycete, possessing interesting chemical properties and utilized in factories and advanced construction.
item.eventide-ev-b04-trealose.name = [#4900BF]Trealose[]
item.eventide-ev-b04-trealose.description = [green]>[cyan]A sugar extracted from decomposition broth, used in chemical reactions to produce energy for the umbramycete.
item.eventide-ev-c01-swarm-pieces.name = [#004A07]Swarm Pieces[]
item.eventide-ev-c01-swarm-pieces.description = [green]>[cyan]Body parts from swarm units have various uses, depending on what you wish to do with them.

