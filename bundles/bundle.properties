block.eventide-ev-01-def-dark-rock-wall.description = Protects structures from incoming damage.
block.eventide-ev-02-def-large-dark-rock-wall.name = Large Dark Rock Wall
block.eventide-ev-02-def-large-dark-rock-wall.description = Protects structures from incoming damage.
