unit.eventide-ev-unt-cor-b01-cordcycep.name = Cordycep
unit.eventide-ev-unt-cor-b01-cordcycep.description = [green]>[cyan]A creeping form of the umbramycete, capable of surviving independently without needing to be connected to the mycelial network. It provides protection, constructs structures, mines resources, and combats threats to the umbramycete. It also infects enemy units with spores, converting them to the allied side.

