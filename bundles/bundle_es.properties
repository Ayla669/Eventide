block.eventide-ev-05-razryarost.name = [#55AC60]Razryarost
block.eventide-ev-05-razryarost.description = Destruye violentamente los Cristales de Rybek, liberando enormes cantidades de energía. El proceso produce Rybek líquido, que es extremadamente peligroso. Si no se drena con frecuencia, puede explotar.
block.eventide-ev-01-soil-filter.name = Filtro de suelo
block.eventide-ev-01-soil-filter.description = Filtra el suelo de Izanami para extraer minerales en pequeñas cantidades.
block.eventide-ev-02-charcoal-press.name = Prensa de carbón vegetal
block.eventide-ev-02-charcoal-press.description = Tritura carbón vegetal a altas presiones hasta convertirlo en grafito.
block.eventide-ev-03-silicon-casting.name = Fundición de silicio
block.eventide-ev-03-silicon-casting.description = Funde grafito, arena y hierro para producir silicio. Genera escoria como subproducto.
block.eventide-ev-04-glass-furnace.name = Horno de vidrio
block.eventide-ev-04-glass-furnace.description = Mezcla arena y metales fundidos para crear un vidrio extremadamente resistente.
block.eventide-ev-desintegrator.name = Desintegrador
block.eventide-ev-desintegrator.description = Utiliza energía para quemar y destruir los objetos introducidos.
block.eventide-ev-core-dark.name = Núcleo: Oscuro
block.eventide-ev-core-dark.description = Núcleo de la base. Blindado y con capacidad para almacenar una cantidad media de objetos.
block.eventide-ev-iron-box.name = Caja de hierro
block.eventide-ev-iron-box.description = Almacena objetos en grandes cantidades.
block.eventide-ev-01-gear.name = Gear
block.eventide-ev-01-gear.description = Dispara ráfagas rápidas de balas contra los enemigos.
block.eventide-ev-02-oerlikon.name = Oerlikon
block.eventide-ev-02-oerlikon.description = Una torreta antiaérea. Dispara proyectiles de fragmentación contra los objetivos.
block.eventide-ev-03-nukaton.name = Nukaton
block.eventide-ev-03-nukaton.description = Lanza misiles guiados extremadamente potentes.
block.eventide-ev-02-welder.name = Soldador
block.eventide-ev-02-welder.description = Dispara un doble rayo, energizado y calentado con escoria.
block.eventide-ev-01-def-dark-rock-wall.name = Pared de roca oscura
block.eventide-ev-01-def-dark-rock-wall.description = Protege las estructuras del daño recibido.
block.eventide-ev-02-def-large-dark-rock-wall.name = Pared grande de roca oscura
block.eventide-ev-02-def-large-dark-rock-wall.description = Protege las estructuras del daño recibido.
block.eventide-ev-03-iron-wall.name = Pared de hierro
block.eventide-ev-03-iron-wall.description = Protege las estructuras del daño recibido.
block.eventide-ev-04-large-iron-wall.name = Pared grande de hierro
block.eventide-ev-04-large-iron-wall.description = Protege las estructuras del daño recibido.
block.eventide-ev-05-rybek-wall.name = Pared de Rybek
block.eventide-ev-05-rybek-wall.description = Protege las estructuras del daño recibido. Ralentiza y daña a los enemigos cercanos, aplicando el efecto Gamma.
block.eventide-ev-06-large-rybek-wall.name = Pared de Rybek
block.eventide-ev-06-large-rybek-wall.description = Protege las estructuras del daño recibido. Ralentiza y daña a los enemigos cercanos, aplicando el efecto Gamma.
item.eventide-ev-charcoal.name = Carbón vegetal
item.eventide-ev-charcoal.description = Carbón vegetal formado a partir de la vegetación incinerada de la superficie de Izanami.
item.eventide-ev-dark-glass.name = Vidrio oscuro
item.eventide-ev-dark-glass.description = Vidrio oscuro fabricado con arena oscura y plomo. Se utiliza para fabricar unidades y estructuras, y también como munición.
item.eventide-ev-dark-rock.name = Roca oscura
item.eventide-ev-dark-rock.description = Una roca oscura procedente de la superficie calcinada de Izanami. Se utiliza en construcción y para fabricar materiales básicos.
item.eventide-ev-dark-sand.name = Arena oscura
item.eventide-ev-dark-sand.description = Arena oscura de la superficie de Izanami. Se utiliza para fabricar materiales básicos.
item.eventide-ev-dark-soil.name = Tierra oscura
item.eventide-ev-dark-soil.description = Suelo ennegrecido de Izanami. Se utiliza en construcciones muy básicas, pero también es rico en una gran variedad de minerales.
item.eventide-ev-gold.name = Oro
item.eventide-ev-gold.description = Oro en bruto encontrado en la tierra oscura de Izanami. Se utiliza para construcción básica y componentes electrónicos (puede refinarse para su uso en construcciones avanzadas).
item.eventide-ev-graphite.name = Grafito
item.eventide-ev-graphite.description = Grafito fabricado a partir del carbón vegetal de Izanami. Un material resistente y de baja conductividad, utilizado en construcción y reactores, pero lo bastante fuerte como para servir de munición.
item.eventide-ev-iron.name = Hierro
item.eventide-ev-iron.description = Hierro encontrado en el suelo de Izanami. Tiene baja conductividad, pero es muy resistente. Se utiliza en diversos proyectos de construcción y para fabricar objetos; también puede servir como munición.
item.eventide-ev-lead.name = Plomo
item.eventide-ev-lead.description = Plomo, un material resistente encontrado en el suelo de Izanami. Puede utilizarse en construcción, reactores, la fabricación de otros objetos e incluso como munición.
item.eventide-ev-rybek-crystals.name = Cristales de Rybek
item.eventide-ev-rybek-crystals.description = Cristales con diversas propiedades que quedaron esparcidos por la superficie de Izanami tras la colisión con Kagutsuchi. Son necesarios para casi toda la construcción en Izanami. Por desgracia, en su estado bruto tienen una utilidad extremadamente limitada y deben refinarse para aplicaciones más avanzadas.
item.eventide-ev-silicon.name = Silicio
item.eventide-ev-silicon.description = El silicio de Izanami es un componente esencial para construcciones de todos los niveles y para fabricar objetos y unidades avanzados.
liquid.eventide-ev-liq-contamined-water.name = Agua contaminada
liquid.eventide-ev-liq-contamined-water.description = Agua que alguna vez fue limpia y que ahora está contaminada por diversos minerales tóxicos.
liquid.eventide-ev-liquid-rybek.name = Rybek líquido
liquid.eventide-ev-liquid-rybek.description = Producido al mezclar fragmentos de Rybek con agua contaminada, este líquido extremadamente caliente y viscoso es hasta diez veces más radiactivo y peligroso que el Rybek en su forma bruta. Puede dañar maquinaria y perjudicar a los seres vivos. Puede contaminar una zona durante cierto tiempo si se desecha de forma incorrecta.
liquid.eventide-ev-swarm-blood.name = Sangre del enjambre
planet.eventide-izanami.name = Izanami
sector.eventide-19s-01-rebirth.name = Renacimiento
sector.eventide-19s-01-rebirth.description = "El comienzo después del fin...
unit.eventide-ev-pigumi.name = Pigumi
unit.eventide-ev-pigumi.description = Una unidad núcleo pequeña pero práctica. Protege, construye, mina y repara estructuras dañadas.
unit.eventide-ev-gauromydas.name = Gauromydas
unit.eventide-ev-gauromydas.description = Un soldado volador del enjambre. Nace bajo condiciones específicas durante la fase de metamorfosis de la citheronia.
unit.eventide-ev-aragog.name = Aragog
unit.eventide-ev-aragog.description = Un Aranicidae adolescente que creció hasta convertirse en un combatiente del enjambre, lanzando escarabajos explosivos contra los enemigos.
unit.eventide-ev-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-aranicidae-nymph.description = Una ninfa de la familia Aranicidae. Es rápida, pero por sí sola representa casi ninguna amenaza. Sin embargo, puede convertirse en un gran problema en grandes cantidades y daña las estructuras al entrar en contacto con ellas.
unit.eventide-bettle.name = Bettle
unit.eventide-bettle.description = Nacido para amar. Entrenado para explotar.
unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon
unit.eventide-ev-arthropleura.name = Arthropleura
unit.eventide-ev-arthropleura.description = Una joven reina del enjambre que ha desarrollado un caparazón extremadamente resistente y una piel gruesa capaz de soportar la radiación. Genera constantemente nuevos soldados para luchar por ella.
unit.eventide-ev-attakus.name = Attakus
unit.eventide-ev-attakus.description = Una citheronia que eligió permanecer en su forma larvaria, siguiendo el camino de la realeza. Esta criatura se prepara para dar a luz a cientos de nuevas larvas, aunque todavía es muy joven.
unit.eventide-ev-citheronia.name = Citheronia
unit.eventide-ev-citheronia.description = Una larva de Aranicidae, la etapa inicial del ciclo de vida de esta especie y la etapa definitiva en la que el Aranicidae decide si someterse a la metamorfosis o continuar como oruga.
unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = ¡EL NÚMERO UNO DE BRAZUKA, BABY!
status.eventide-ev-01-planetary-research-result.details = [green] Resultados de búsqueda:\n\n[cyan]> Izanami se formó como un pequeño mundo rocoso que orbitaba el Sol. Su superficie inicial era inestable y en gran parte estéril, pero con el paso del tiempo geológico el planeta se enfrió, el agua se acumuló y su atmósfera se estabilizó gradualmente, creando condiciones adecuadas para la vida...\n\n> Los primeros organismos surgieron en las aguas de Izanami como microorganismos primitivos. Durante millones de años, la vida se diversificó y se adaptó a casi todos los entornos del planeta, formando finalmente una biosfera inusualmente densa y compleja...\n\n> Durante un período desconocido, Izanami siguió siendo un mundo próspero hasta que...[red][datos corruptos]
