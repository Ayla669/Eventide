mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]愛蘭-♡
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] Un mundo no-muerto...
mod.eventide.description = [#037300[]]Eventide es un ambicioso mod centrado en crear una nueva campaña con su propio lore único. Tiene lugar en un planeta que alguna vez estuvo repleto de vida abundante y longeva, pero que se convirtió en un páramo desolado tras una enorme catástrofe (aunque no quedó desprovisto de vida). El planeta es rico en minerales valiosos y está habitado por numerosas formas de vida extremadamente territoriales.\n\n[#FF0000[]]Nota: El mod aún se encuentra en una fase temprana de desarrollo; muchas cosas pueden cambiar en el futuro, como sprites, sonidos, enemigos, lore, etc.\n\n[#83C0E4[]]Colaboradores:\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] Todavía es una demo.
