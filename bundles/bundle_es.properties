block.eventide-ev-02-iron-drill.description = Una buena perforadora diseñada para extraer recursos más rápido.
block.eventide-ev-03-multi-drill.name = Perforadora múltiple
block.eventide-ev-03-multi-drill.description = Una perforadora avanzada diseñada para extraer recursos duros del suelo.
