mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]愛蘭-♡
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] Eine untote Welt...
mod.eventide.description = [#037300[]]Eventide ist ein ambitionierter Mod, der sich darauf konzentriert, eine neue Kampagne mit einer eigenen, einzigartigen Geschichte zu erschaffen. Er spielt auf einem Planeten, der einst von vielfältigem, seit langer Zeit bestehendem Leben wimmelte, nach einer gewaltigen Katastrophe jedoch zu einer trostlosen Ödnis wurde (wenn auch nicht zu einer völlig leblosen). Der Planet ist reich an wertvollen Mineralien und wird von zahlreichen, äußerst territorialen Lebensformen bewohnt.\n\n[#FF0000[]]Hinweis: Der Mod befindet sich noch in einer frühen Entwicklungsphase; viele Dinge können sich in Zukunft noch ändern, etwa Sprites, Sounds, Gegner, Lore usw.\n\n[#83C0E4[]]Mitwirkende:\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] Es ist noch eine Demo.
