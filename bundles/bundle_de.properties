block.eventide-ev-03-burning-generator.name = Brenngenerator
block.eventide-ev-03-burning-generator.description = Verbrennt Holzkohle, um Energie zu erzeugen.
block.eventide-ev-04-steam-generator.name = Dampfgenerator
block.eventide-ev-04-steam-generator.description = Erzeugt Energie durch das Erhitzen von Wasser.
block.eventide-ev-05-razryarost.name = [#55AC60]Razryarost
block.eventide-ev-05-razryarost.description = Zerstört Rybek-Kristalle gewaltsam und setzt dabei gewaltige Mengen Energie frei. Dabei entsteht flüssiges Rybek, das extrem gefährlich ist. Wenn es nicht regelmäßig abgeleitet wird, kann es explodieren.
block.eventide-ev-01-soil-filter.name = Bodenfilter
block.eventide-ev-01-soil-filter.description = Filtert Izanamis Erde, um kleine Mengen an Mineralien zu gewinnen.
block.eventide-ev-02-charcoal-press.name = Holzkohlepresse
block.eventide-ev-02-charcoal-press.description = Zerkleinert Holzkohle unter hohem Druck, bis sie sich in Graphit verwandelt.
block.eventide-ev-03-silicon-casting.name = Silikonguss
block.eventide-ev-03-silicon-casting.description = Schmilzt Graphit, Sand und Eisen zu Silizium. Erzeugt Schlacke als Nebenprodukt.
block.eventide-ev-04-glass-furnace.name = Glasofen
block.eventide-ev-04-glass-furnace.description = Vermischt Sand und geschmolzene Metalle zu äußerst widerstandsfähigem Glas.
block.eventide-ev-desintegrator.name = Desintegrator
block.eventide-ev-desintegrator.description = Verwendet Energie, um eingebrachte Gegenstände zu verbrennen und zu zerstören.
block.eventide-ev-core-dark.name = Kern: Dunkel
block.eventide-ev-core-dark.description = Kern der Basis. Gepanzert und mit mittlerer Lagerkapazität.
block.eventide-ev-iron-box.name = Eisenkiste
block.eventide-ev-iron-box.description = Lagert größere Mengen an Gegenständen.
block.eventide-ev-01-gear.name = Gear
block.eventide-ev-01-gear.description = Feuert schnell Salven auf Gegner.
block.eventide-ev-02-oerlikon.name = Oerlikon
block.eventide-ev-02-oerlikon.description = Eine Flugabwehrkanone. Feuert Splittergeschosse auf Ziele.
block.eventide-ev-03-nukaton.name = Nukaton
block.eventide-ev-03-nukaton.description = Startet extrem mächtige Lenkflugkörper.
block.eventide-ev-02-welder.name = Welder
block.eventide-ev-02-welder.description = Feuert einen Doppelstrahl ab – mit Energie versorgt und durch Schlacke erhitzt.
block.eventide-ev-01-def-dark-rock-wall.name = Wand aus Dunklem Gestein
block.eventide-ev-01-def-dark-rock-wall.description = Schützt Strukturen vor eingehendem Schaden.
block.eventide-ev-02-def-large-dark-rock-wall.name = Große Wand aus Dunklem Gestein
block.eventide-ev-02-def-large-dark-rock-wall.description = Schützt Strukturen vor eingehendem Schaden.
block.eventide-ev-03-iron-wall.name = Eisenwand
block.eventide-ev-03-iron-wall.description = Schützt Strukturen vor eingehendem Schaden.
block.eventide-ev-04-large-iron-wall.name = Große Eisenwand
block.eventide-ev-04-large-iron-wall.description = Schützt Strukturen vor eingehendem Schaden.
block.eventide-ev-05-rybek-wall.name = Rybek-Wand
block.eventide-ev-05-rybek-wall.description = Schützt Strukturen vor eingehendem Schaden. Verlangsamt Gegner in der Nähe, fügt ihnen Schaden zu und wendet den Gamma-Effekt an.
block.eventide-ev-06-large-rybek-wall.name = Rybek-Wand
block.eventide-ev-06-large-rybek-wall.description = Schützt Strukturen vor eingehendem Schaden. Verlangsamt Gegner in der Nähe, fügt ihnen Schaden zu und wendet den Gamma-Effekt an.
item.eventide-ev-charcoal.name = Holzkohle
item.eventide-ev-charcoal.description = Holzkohle, die aus der verbrannten Pflanzenwelt an der Oberfläche von Izanami entstanden ist.
item.eventide-ev-dark-glass.name = Dunkles Glas
item.eventide-ev-dark-glass.description = Dunkles Glas aus dunklem Sand und Blei. Wird zur Herstellung von Einheiten und Strukturen sowie als Munition verwendet.
item.eventide-ev-dark-rock.name = Dunkles Gestein
item.eventide-ev-dark-rock.description = Ein dunkles Gestein von der verbrannten Oberfläche Izanamis. Wird für den Bau und die Herstellung grundlegender Materialien verwendet.
item.eventide-ev-dark-sand.name = Dunkler Sand
item.eventide-ev-dark-sand.description = Dunkler Sand von der Oberfläche Izanamis. Wird zur Herstellung grundlegender Materialien verwendet.
item.eventide-ev-dark-soil.name = Dunkle Erde
item.eventide-ev-dark-soil.description = Izanamis geschwärzte Erde. Wird für sehr einfache Konstruktionen verwendet und ist zugleich reich an verschiedensten Mineralien.
item.eventide-ev-gold.name = Gold
item.eventide-ev-gold.description = Rohgold aus der dunklen Erde Izanamis. Wird für grundlegende Konstruktionen und elektronische Komponenten verwendet (kann für fortgeschrittene Konstruktionen veredelt werden).
item.eventide-ev-graphite.name = Graphit
item.eventide-ev-graphite.description = Aus Izanamis Holzkohle hergestelltes Graphit. Ein langlebiges, schlecht leitendes Material, das für Konstruktionen und Reaktoren verwendet wird und zugleich robust genug für Munition ist.
item.eventide-ev-iron.name = Eisen
item.eventide-ev-iron.description = Im Boden Izanamis vorkommendes Eisen. Es leitet Strom schlecht, ist aber äußerst widerstandsfähig. Wird für verschiedene Bauprojekte und zur Herstellung von Gegenständen verwendet und kann auch als Munition dienen.
item.eventide-ev-lead.name = Blei
item.eventide-ev-lead.description = Blei, ein widerstandsfähiges Material aus dem Boden Izanamis. Es kann für Konstruktionen, Reaktoren, die Herstellung anderer Gegenstände und sogar als Munition verwendet werden.
item.eventide-ev-rybek-crystals.name = Rybek-Kristalle
item.eventide-ev-rybek-crystals.description = Kristalle mit verschiedenen Eigenschaften, die nach der Kollision mit Kagutsuchi über die Oberfläche Izanamis verstreut wurden. Sie werden für fast alle Konstruktionen auf Izanami benötigt. In ihrem Rohzustand sind sie jedoch leider nur sehr eingeschränkt nutzbar und müssen für bessere Anwendungen veredelt werden.
item.eventide-ev-silicon.name = Silizium
item.eventide-ev-silicon.description = Silizium ist auf Izanami ein unverzichtbarer Bestandteil von Konstruktionen aller Stufen sowie der Herstellung fortschrittlicher Gegenstände und Einheiten.
liquid.eventide-ev-liq-contamined-water.name = Kontaminiertes Wasser
liquid.eventide-ev-liq-contamined-water.description = Wasser, das einst sauber war und nun durch verschiedene giftige Mineralien kontaminiert ist.
liquid.eventide-ev-liquid-rybek.name = Flüssiges Rybek
liquid.eventide-ev-liquid-rybek.description = Entsteht durch das Vermischen von Rybek-Fragmenten mit kontaminiertem Wasser. Diese extrem heiße und zähflüssige Flüssigkeit ist bis zu zehnmal radioaktiver und gefährlicher als Rybek in seiner Rohform. Sie kann Maschinen beschädigen und dabei Lebewesen schädigen. Bei unsachgemäßer Entsorgung kann sie ein Gebiet für eine gewisse Zeit kontaminieren.
liquid.eventide-ev-swarm-blood.name = Schwarmblut
planet.eventide-izanami.name = Izanami
sector.eventide-19s-01-rebirth.name = Wiedergeburt
sector.eventide-19s-01-rebirth.description = "Der Anfang nach dem Ende...
unit.eventide-ev-pigumi.name = Pigumi
unit.eventide-ev-pigumi.description = Eine kleine, aber praktische Kerneinheit. Sie schützt, baut, baut ab und repariert beschädigte Strukturen.
unit.eventide-ev-gauromydas.name = Gauromydas
unit.eventide-ev-gauromydas.description = Ein fliegender Soldat des Schwarms. Entsteht unter bestimmten Bedingungen während der Metamorphosephase der Citheronia.
unit.eventide-ev-aragog.name = Aragog
unit.eventide-ev-aragog.description = Ein heranwachsendes Aranicidae, das zu einem Schwarmkämpfer herangewachsen ist und explosive Käfer auf Gegner schleudert
unit.eventide-ev-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-aranicidae-nymph.description = Eine Nymphe der Aranicidae-Familie. Sie ist schnell, stellt allein jedoch kaum eine Bedrohung dar. In großer Zahl kann sie allerdings zu einem erheblichen Problem werden und beschädigt Strukturen bei Kontakt.
unit.eventide-bettle.name = Bettle
unit.eventide-bettle.description = Geboren, um zu lieben. Ausgebildet, um zu explodieren.
unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon
unit.eventide-ev-arthropleura.name = Arthropleura
unit.eventide-ev-arthropleura.description = Eine junge Schwarmkönigin. Sie hat einen extrem widerstandsfähigen Panzer und eine dicke Haut entwickelt, die Strahlung standhalten kann. Sie erzeugt ständig neue Soldaten, die für sie kämpfen.
unit.eventide-ev-attakus.name = Attakus
unit.eventide-ev-attakus.description = Eine Citheronia, die sich dafür entschieden hat, in ihrer Larvenform zu verbleiben und dem Weg des Adels zu folgen. Dieses Wesen bereitet sich darauf vor, Hunderte neuer Larven hervorzubringen, obwohl es noch sehr jung ist.
unit.eventide-ev-citheronia.name = Citheronia
unit.eventide-ev-citheronia.description = Eine Aranicidae-Larve, die erste Phase des Lebenszyklus dieser Spezies und zugleich die entscheidende Phase, in der die Aranicidae entscheidet, ob sie eine Metamorphose durchläuft oder als Raupe weiterlebt.
unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = DER ALLERBESTE AUS BRAZUKA, BABY!
status.eventide-ev-01-planetary-research-result.details = [green] Forschungsergebnisse:\n\n[cyan]> Izanami entstand als kleine felsige Welt, die die Sonne umkreist. Ihre frühe Oberfläche war instabil und weitgehend karg, doch im Laufe der geologischen Zeit kühlte der Planet ab, Wasser sammelte sich an und seine Atmosphäre stabilisierte sich allmählich, wodurch lebensfreundliche Bedingungen entstanden...\n\n> Die ersten Organismen entstanden in den Gewässern Izanamis als primitive Mikroorganismen. Über Millionen von Jahren entwickelte sich das Leben weiter und passte sich nahezu jeder Umgebung des Planeten an, bis schließlich eine ungewöhnlich dichte und komplexe Biosphäre entstand...\n\n> Für einen unbekannten Zeitraum blieb Izanami eine blühende Welt, bis...[red][beschädigte Daten]
