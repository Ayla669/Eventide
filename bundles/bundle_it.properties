block.eventide-ev-03-iron-wall.description = Protegge le strutture dai danni in arrivo.
block.eventide-ev-04-large-iron-wall.name = Grande Parete di Ferro
block.eventide-ev-04-large-iron-wall.description = Protegge le strutture dai danni in arrivo.
block.eventide-ev-05-rybek-wall.name = Parete di Rybek
block.eventide-ev-05-rybek-wall.description = Protegge le strutture dai danni in arrivo. Rallenta e danneggia i nemici vicini, applicando l'effetto Gamma.
block.eventide-ev-06-large-rybek-wall.name = Parete di Rybek
block.eventide-ev-06-large-rybek-wall.description = Protegge le strutture dai danni in arrivo. Rallenta e danneggia i nemici vicini, applicando l'effetto Gamma.
item.eventide-ev-charcoal.name = Carbone
item.eventide-ev-charcoal.description = Carbone formato dalla vita vegetale incenerita sulla superficie di Izanami.
item.eventide-ev-dark-glass.name = Vetro Scuro
item.eventide-ev-dark-glass.description = Vetro scuro ottenuto da sabbia scura e piombo. Utilizzato nella fabbricazione di unità e strutture, e anche come munizione.
item.eventide-ev-dark-rock.name = Roccia Oscura
item.eventide-ev-dark-rock.description = Una roccia scura proveniente dalla superficie carbonizzata di Izanami. Utilizzata nella costruzione e nella produzione di materiali di base.
item.eventide-ev-dark-sand.name = Sabbia Scura
item.eventide-ev-dark-sand.description = Sabbia scura proveniente dalla superficie di Izanami. Utilizzata nella produzione di materiali di base.
item.eventide-ev-dark-soil.name = Suolo Scuro
item.eventide-ev-dark-soil.description = Suolo annerito di Izanami. Utilizzato in costruzioni molto semplici, ma anche ricco di un'ampia varietà di minerali.
item.eventide-ev-gold.name = Oro
item.eventide-ev-gold.description = Oro grezzo trovato nel suolo scuro di Izanami. Utilizzato per costruzioni di base e componenti elettronici (può essere raffinato per l'uso in costruzioni avanzate).
item.eventide-ev-graphite.name = Grafite
item.eventide-ev-graphite.description = Grafite prodotta dal carbone di Izanami. Un materiale resistente e a bassa conduttività utilizzato nelle costruzioni e nei reattori, ma abbastanza resistente da servire come munizione.
item.eventide-ev-iron.name = Ferro
item.eventide-ev-iron.description = Ferro trovato nel suolo di Izanami. Ha una bassa conduttività ma un'elevata resistenza. Utilizzato in vari progetti di costruzione e nella fabbricazione di oggetti; può anche servire come munizione.
item.eventide-ev-lead.name = Piombo
item.eventide-ev-lead.description = Piombo, un materiale resistente trovato nel suolo di Izanami. Può essere utilizzato nelle costruzioni, nei reattori, nella fabbricazione di altri oggetti e persino come munizione.
item.eventide-ev-rybek-crystals.name = Cristalli di Rybek
item.eventide-ev-rybek-crystals.description = Cristalli dalle proprietà diverse, sparsi sulla superficie di Izanami in seguito alla collisione con Kagutsuchi. Sono necessari per quasi tutte le costruzioni su Izanami. Purtroppo, allo stato grezzo, hanno un'utilità estremamente limitata e devono essere raffinati per applicazioni migliori.
item.eventide-ev-silicon.name = Silicio
item.eventide-ev-silicon.description = Il silicio di Izanami è un componente essenziale per costruzioni di ogni livello e per la fabbricazione di oggetti e unità avanzati.
liquid.eventide-ev-liq-contamined-water.name = Acqua Contaminata
liquid.eventide-ev-liq-contamined-water.description = Acqua che un tempo era pulita, ora contaminata da vari minerali tossici.
liquid.eventide-ev-liquid-rybek.name = Rybek Liquido
liquid.eventide-ev-liquid-rybek.description = Prodotto mescolando frammenti di Rybek con acqua contaminata, questo liquido estremamente caldo e viscoso è fino a dieci volte più radioattivo e pericoloso del Rybek allo stato grezzo. Può danneggiare i macchinari e gli esseri viventi durante il processo. Se smaltito in modo scorretto, può contaminare un'area per un certo periodo.
liquid.eventide-ev-swarm-blood.name = Sangue dello Sciame
planet.eventide-izanami.name = Izanami
sector.eventide-19s-01-rebirth.name = Rinascita
sector.eventide-19s-01-rebirth.description = "L'inizio dopo la fine...
unit.eventide-ev-pigumi.name = Pigumi
unit.eventide-ev-pigumi.description = Una piccola ma pratica unità nucleo. Protegge, costruisce, estrae risorse e ripara le strutture danneggiate.
unit.eventide-ev-gauromydas.name = Gauromydas
unit.eventide-ev-gauromydas.description = Un soldato volante dello sciame. Nato in condizioni specifiche durante la fase di metamorfosi della Citheronia.
unit.eventide-ev-aragog.name = Aragog
unit.eventide-ev-aragog.description = Un Aranicidae adolescente cresciuto fino a diventare un combattente dello sciame, che lancia Bettle esplosivi contro i nemici.
unit.eventide-ev-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-aranicidae-nymph.description = Un esemplare giovanile di Aranicidae. È veloce, ma da solo rappresenta una minaccia quasi nulla. Tuttavia, può diventare un grosso problema in grandi quantità e danneggia le strutture al contatto.
unit.eventide-bettle.name = Bettle
unit.eventide-bettle.description = Nato per amare. Addestrato per esplodere.
unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon
unit.eventide-ev-arthropleura.name = Arthropleura
unit.eventide-ev-arthropleura.description = Una giovane regina dello sciame, ha sviluppato un esoscheletro estremamente resistente e una pelle spessa capace di sopportare le radiazioni. Genera costantemente nuovi soldati affinché combattano per lei.
unit.eventide-ev-attakus.name = Attakus
unit.eventide-ev-attakus.description = Una Citheronia che ha scelto di rimanere nella sua forma larvale, seguendo il cammino della regalità. Questa creatura si sta preparando a dare alla luce centinaia di nuove forme larvali, sebbene sia ancora molto giovane.
unit.eventide-ev-citheronia.name = Citheronia
unit.eventide-ev-citheronia.description = Una forma larvale di Aranicidae, la fase iniziale del ciclo vitale di questa specie e la fase decisiva in cui l'Aranicidae decide se intraprendere la metamorfosi o continuare nella sua forma larvale.
unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = IL NUMERO UNO DI BRAZUKA, BABY!
status.eventide-ev-01-planetary-research-result.details = [green] Risultati della ricerca:\n\n[cyan]> Izanami si è formata come un piccolo mondo roccioso in orbita attorno al Sole. La sua superficie iniziale era instabile e in gran parte sterile, ma nel corso del tempo geologico il pianeta si è raffreddato, l'acqua si è accumulata e la sua atmosfera si è gradualmente stabilizzata, creando condizioni adatte alla vita...\n\n> I primi organismi sono emersi nelle acque di Izanami sotto forma di microrganismi primitivi. Nel corso di milioni di anni, la vita si è diversificata e adattata a quasi ogni ambiente del pianeta, formando infine una biosfera insolitamente densa e complessa...\n\n> Per un periodo sconosciuto, Izanami è rimasta un mondo rigoglioso, finché...[red][dati corrotti]
