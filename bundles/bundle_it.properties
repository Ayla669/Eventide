block.eventide-ev-05-razryarost.name = [#55AC60]Razryarost
block.eventide-ev-05-razryarost.description = Distrugge violentemente i Cristalli di Rybek, liberando enormi quantità di energia. Il processo produce Rybek liquido, estremamente pericoloso. Se non viene drenato frequentemente, può esplodere.
block.eventide-ev-01-soil-filter.name = Filtro del Suolo
block.eventide-ev-01-soil-filter.description = Filtra il suolo di Izanami per estrarre minerali in piccole quantità.
block.eventide-ev-02-charcoal-press.name = Pressa per Carbone
block.eventide-ev-02-charcoal-press.description = Frantuma il carbone ad alta pressione finché non si trasforma in grafite.
block.eventide-ev-03-silicon-casting.name = Colata di Silicio
block.eventide-ev-03-silicon-casting.description = Fonde grafite, sabbia e ferro per ottenere silicio. Produce scorie come sottoprodotto.
block.eventide-ev-04-glass-furnace.name = Forno per Vetro
block.eventide-ev-04-glass-furnace.description = Mescola sabbia e metalli fusi per ottenere un vetro estremamente resistente.
block.eventide-ev-desintegrator.name = Disintegratore
block.eventide-ev-desintegrator.description = Usa energia per bruciare e distruggere gli oggetti inseriti al suo interno.
block.eventide-ev-core-dark.name = Nucleo: Oscuro
block.eventide-ev-core-dark.description = Nucleo della base. Corazzato e capace di immagazzinare una quantità media di oggetti.
block.eventide-ev-iron-box.name = Cassa di Ferro
block.eventide-ev-iron-box.description = Conserva oggetti in quantità maggiori.
block.eventide-ev-01-gear.name = Gear
block.eventide-ev-01-gear.description = Spara rapidamente raffiche di proiettili contro i nemici.
block.eventide-ev-02-oerlikon.name = Oerlikon
block.eventide-ev-02-oerlikon.description = Una torretta antiaerea. Spara proiettili a frammentazione contro i bersagli.
block.eventide-ev-03-nukaton.name = Nukaton
block.eventide-ev-03-nukaton.description = Lancia missili guidati estremamente potenti.
block.eventide-ev-02-welder.name = Welder
block.eventide-ev-02-welder.description = Spara un doppio raggio, energizzato e riscaldato con scorie.
block.eventide-ev-01-def-dark-rock-wall.name = Parete di Roccia Oscura
block.eventide-ev-01-def-dark-rock-wall.description = Protegge le strutture dai danni in arrivo.
