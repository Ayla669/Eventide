mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]愛蘭-♡
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] Un mondo non morto...
mod.eventide.description = [#037300[]]Eventide è una mod ambiziosa incentrata sulla creazione di una nuova campagna con una propria lore unica. È ambientata su un pianeta che un tempo brulicava di forme di vita abbondanti e longeve, ma che è diventato una landa desolata in seguito a una catastrofe gigantesca (sebbene non completamente priva di vita). Il pianeta è ricco di minerali preziosi ed è abitato da numerose forme di vita estremamente territoriali.\n\n[#FF0000[]]Nota: la mod è ancora nelle prime fasi di sviluppo; molte cose potrebbero cambiare in futuro, come sprite, suoni, nemici, lore, ecc.\n\n[#83C0E4[]]Collaboratori:\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] È ancora una demo.
