block.eventide-ev-02-oerlikon.name = Oerlikon
block.eventide-ev-02-oerlikon.description = Torreta Anti-Áerea. Dispara balas de fragmentação contra Alvos.

block.eventide-ev-03-nukaton.name = Nukaton
block.eventide-ev-03-nukaton.description = Lança um míssel teleguiado extremamente poderoso.

block.eventide-ev-02-welder.name = Welder
block.eventide-ev-02-welder.description = Lança um Feixe duplo de energia e Escória aquecida.

