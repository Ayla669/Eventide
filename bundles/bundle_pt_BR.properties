# Swarm units

unit.eventide-ev-unt-crw-c01-citheronia.name = Citheronia
unit.eventide-ev-unt-crw-c01-citheronia.description = [green]>[cyan]Aparentemente o primeiro estágio da vida do enxame. Possui uma casca externa resistente para se proteger enquanto ainda é lenta e não tem defesas.
unit.eventide-ev-unt-leg-c01-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-unt-leg-c01-aranicidae-nymph.description = [green]>[cyan]Uma forma madura da Citheronia, rápida e pequena, ela perde sua carapaça rígida durante a metamorfose. Sozinha não é grande ameaça, mas em grandes números se torna um problema enorme.
unit.eventide-ev-unt-crw-c02-attakus.name = Attakus
unit.eventide-ev-unt-crw-c02-attakus.description = [green]>[cyan]Uma citheronia que não passou pelo processo de metamorfose e parece estar seguindo um caminho diferente. Sua casca externa é muito mais espessa e carrega consigo várias larvas do enxame.
unit.eventide-ev-unt-leg-c02-brachitus.name = Brachitus
unit.eventide-ev-unt-leg-c02-brachitus.description = [green]>[cyan]Uma aracnacana madura, com carapaça mais resistente e sangue excepcionalmente quente. Sua pressão interna é alta o suficiente para permitir que ela dispare o próprio sangue nos inimigos. Avança em alta velocidade para cima de seus alvos.
unit.eventide-ev-unt-crw-c03-arthropleura.name = Arthropleura
unit.eventide-ev-unt-crw-c03-arthropleura.description = [green]>[cyan]Uma suposta rainha do enxame, ela possui uma carapaça extremamente resistente e produz constantemente novos soldados para se defender... embora pareça ainda não ter atingido seu auge.
unit.eventide-ev-unt-leg-c03-aragog.name = Aragog
unit.eventide-ev-unt-leg-c03-aragog.description = [green]>[cyan]Um guerreiro do enxame. Esses soldados possuem carapaças extremamente duras e carregam consigo vários besouros explosivos, que lançam nos inimigos à longa distância.
unit.eventide-ev-unt-fly-c02-gauromydas.name = Gauromydas
unit.eventide-ev-unt-fly-c02-gauromydas.description = [green]>[cyan]Um soldado voador do enxame. Nasce sob condições específicas durante a fase de metamorfose da citheronia.

