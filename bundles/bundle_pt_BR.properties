block.eventide-ev-05-razryarost.name = [#55AC60]Razryarost
block.eventide-ev-05-razryarost.description = Destroi cristais de Rybek Violentamente, Liberando massivas quantidades de energia. O processo prodyz Rybek Líquido, que é extremamente Perigoso. Se não drenado frequentemente, pode explodir.

