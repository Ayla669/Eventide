# textos da campanha

rebirth.instructions = [green]>[cyan]Leia suas instruções no núcleo com atenção
rebirth.welcome = [green]>[cyan]Bem-vindo a Izanami\n\n[green]>[cyan]Seu objetivo neste planeta é descobrir o máximo sobre sua história e recursos\n para podermos estabelecer uma base planetária e extraí-los
rebirth.basics = [green]>[cyan]Agora vamos ao básico, minere um pouco de [#424B99]rocha negra[] clicando nela\n\n[green]>[cyan]Use [WASD] para se mover, ou arraste seu dedo na tela
rebirth.dark.rock.text = [green]>[cyan]A [#424B99]rocha negra[] [cyan]é um material bem maleável e resistente, perfeito para construções básicas
rebirth.tech.tree = [green]>[cyan]Abra a \ue875 árvore de tecnologia, pesquise a broca negra, e construa ela sob a [#424B99]rocha negra[] para minerá-la automaticamente
rebirth.duct = [green]>[cyan]Pesquise dutos para levar os recursos ao núcleo
rebirth.expand.mining = [green]>[#475757]Ferro[][cyan] é muito útil e necessário para construções mais complexas\n\n[green]>[cyan]Expanda suas operações de mineração
rebirth.explore = [green]>[cyan]Explore a área e extraia alguns recursos
rebirth.vaporflow = [green]>[cyan]Pesquise o vaporflow e coloque-o em cima de uma ventilação para gerar um pouco de energia
rebirth.drone.factory = [green]>[cyan]Pesquise a fábrica de drones radar para explorar a área
rebirth.iron.node = [green]>[cyan]Pesquise e construa um nódulo de ferro para transmitir energia
rebirth.note = [green]>[cyan]Aviso: Mesmo o [#475757]ferro[] sendo um material condutor\nele perde uma quantidade significativa de energia pelo caminho\nportanto construa suas redes elétricas com cuidado

rebirth.warning = [scarlet]⚠︎ Forma de vida hostil detectada ⚠︎

rebirth.swarm = [green]>[scarlet]Formas de vida [cyan] conseguem passar por cima de suas defesas, mas preferem seguir um caminho livre\n\n[green]>[cyan]Portanto, use paredes para criar um caminho que elas prefiram seguir
rebirth.good.luck = [green]>[cyan]Proteja o [yellow]núcleo
rebirth.command = [green]>[cyan]Use Shift + Clique esquerdo ou aperte o botão de comando para selecionar uma unidade, segure para selecionar várias de uma vez\nClique onde você quer que ela vá
rebirth.ammo = [green]>[cyan]Construa uma broca para abastecer suas torretas com munição
rebirth.hostil = [green]>[scarlet]Formas de vida hostil se aproximando

# setores

# <<Principais>>

sector.eventide-19s-01-rebirth.name = Renascimento
sector.eventide-19s-01-rebirth.description = [green]>[cyan]O nosso marco zero para estabelecermos nossa base\n\n[green]>[cyan]Pesquise sobre Izanami e seus recursos\npara podermos extraí-los

sector.eventide-19s-02-brood.name = Ninhada
sector.eventide-19s-02-brood.description = [green]>[cyan]Nosso encontro com uma forma de vida no\nprimeiro setor foi inesperado, o planeta deveria ser desabitado.\n\n[green]>[cyan]Sensores detectaram movimento nesse setor, pouco\nirregular, mas suficiente para indicar a presença de formas\nde vida, entretanto, o terreno é bem inconveniente\ne nos dará trabalho para nos estabelecer aqui\n\n[green]>[cyan]Descubra o que puder sobre o nosso novo "problema" e\nnovas maneiras de nos defender dessas criaturas.

sector.eventide-19s-03-thermal-basin.name = Bacia Termal
sector.eventide-19s-03-thermal-basin.description = [green]>[cyan]A descoberta de vida hostil nesse planeta faz\nnossa missão mais desafiadora daqui pra frente.\n\n[green]>[cyan]Esse setor tem uma alta atividade geotérmica que\npode ser usada para pesquisar novas armas e fontes de energia.

# <<Opcionais>>

sector.eventide-20s-01-petrichor.name = Petricor
sector.eventide-20s-01-petrichor.description = [green]>[cyan]Um rio atravessa esse setor, por causa das frequentes\nchuvas, a correnteza trouxe uma quantidade significativa de [#475757]ferro[]\npara a margem\n\n[orange]<Setor opcional>\n\n[scarlet]> Todas as unidades dão +20% dano

sector.eventide-20s-02-badlands.name = Ermos
sector.eventide-20s-02-badlands.description = [green]>[cyan]Um local desolado com uma alta concentração de [#475757]ferro[]\n\n[orange]<Setor opcional>\n\n[scarlet]> Vida dos blocos -20%\n[scarlet]> Velocidade de construção -20%\n[scarlet]> Todas as unidades dão +20% dano

sector.eventide-20s-03-carapace.name = Carapaça
sector.eventide-20s-03-carapace.description = [green]>[cyan]A zona de pouso desse setor é péssima, porém,\nno lado oposto existe uma boa quantidade de recursos que precisamos.\n\n[orange]<Setor opcional>\n\n[scarlet]> Custo de construção +50%\n[scarlet]> Todas as unidades dão +50% dano\n[scarlet]> Velocidade de construção -50%

sector.eventide-20s-04-burrow.name = Toca
sector.eventide-20s-04-burrow.description = [green]>[cyan]Esse setor contém uma boa quantidade de carvão vegetal que é\nnecessário para nossa pesquisa, entretanto, existem 2 saídas de ninhos\nnos lados opostos do setor, tenha muito cuidado.\n\n[orange]<Setor opcional>\n\n[scarlet]> Custo de construção +20%\n[scarlet]> Todas as unidades dão +50% dano

sector.eventide-20s-05-fumarole.name = Fumarola
sector.eventide-20s-05-fumarole.description = [green]>[cyan]Uma área rica em recursos, porém os sensores detectaram uma\nalta atividade inimiga, provavelmente o enxame está sendo atraído para esta área\ndevido ao intenso calor dela.\n\n[orange]<Setor opcional>\n\n[scarlet]> Vida dos blocos -50%\n[scarlet]> Todas as unidades dão +100% dano

sector.eventide-20s-06-abyss.name = Abismo
sector.eventide-20s-06-abyss.description = [green]>[cyan]Esse setor contém um grande depósito de rybek, mas o movimento\ne a construção serão dificultados pelo gigantesco abismo\nno meio do setor que leva para as profundezas\ndo planeta.\n\n[orange]<Setor opcional>\n\n[scarlet]> Custo de construção +100%\n[scarlet]> Todas as unidades dão +100% dano
