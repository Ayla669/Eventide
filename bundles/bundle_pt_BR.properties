mod.eventide.name = Eventide
mod.eventide.author = [#FC00EB[]]愛蘭-♡
mod.eventide.displayName = [#21FFC5[]]Eventide
mod.eventide.subtitle = [#424B99[]] Um planeta insepulto...

mod.eventide.description = [#037300[]]Eventide é um mod ambicioso focado em criar uma nova campanha com sua própria história única. Isto acontece em um planeta que fora uma vez abundante em vida duradoura, que se tornou abandonado após uma catástrofe massiva (que carregava vida). O planeta é rico em minérios valiosos e é habitado por númerosos, extremamente territoriais enxames de vida.\n\n[#FF0000[]]Nota: O mod ainda está em desenvolvimento inicial; muitas coisas podem mudar no futuro, como sprites, sons, inimigos, lore etc.\n\n[#83C0E4[]]Contribuidores:\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version = [cyan] Ainda está em DEMO.

