liquid.eventide-ev-liq-04-mycelial-exudate.name = [#160041]Exsudato Micelial[]
liquid.eventide-ev-liq-04-mycelial-exudate.description = [green]>[cyan]Um líquido viscoso com propriedades energéticas, extraído do caldo de decomposição, essencialmente um combustível e altamente inflamável.
liquid.eventide-ev-liq-05-liquid-rybek.name = [#00B819]Rybek Líquido[]
liquid.eventide-ev-liq-05-liquid-rybek.description = [green]>[cyan]Produzido misturando fragmentos de Rybek com água contaminada, este líquido extremamente quente e viscoso é até dez vezes mais radioativo e perigoso que o Rybek em sua forma bruta. Pode danificar máquinas e prejudicar seres vivos no processo. Pode contaminar uma área por um certo período se descartado incorretamente.
liquid.eventide-ev-06-liquid-peroxate.name = [#E100E9]Peroxato[]
liquid.eventide-ev-06-liquid-peroxate.description = [green]>[cyan]Um líquido extremamente energético e corrosivo, extremamente perigoso.
