# Research

status.eventide-ev-research-results-0.name = [green]>[scarlet]O Enxame
status.eventide-ev-research-results-0.description = [green]>[cyan]Uma forma de vida insetoide hostil que vive no subterrâneo e sai para a superfície em busca de comida e material para construir seus ninhos, ou quando alguém adentra em seu território.\n\n[green]>[cyan]Eles seguem uma hierarquia similar a outros insetos coloniais, portanto tudo indica que existe alguém no topo dando as ordens.\n\n[green]>[cyan]É estranho existir vida orgânica em Izanami... Achávamos que o planeta era desabitado...
status.eventide-ev-research-results-1.name = [green]>[cyan]Era Protogênica
status.eventide-ev-research-results-1.description = [green]>4.8–4.4 bilhões de anos atrás:\n\n[cyan]> Izanami se formou aproximadamente a 4.8 bilhões de anos atrás devido ao acúmulo de poeira estelar e pedaços de rochas. Por milhões de anos, colisões e o calor interno mantiveram a superfície do planeta coberta por magma.\n\n> Ao longo do tempo o planeta esfriou, permitindo que uma crosta primitiva se formasse. Atividades vulcânicas intensas liberaram grandes quantidades de gases na atmosfera, deixando ela densa e tóxica.\n\n> A temperatura continuou diminuindo, o vapor de água na atmosfera se condensou, causando uma chuva torrencial prolongada por milhares de anos. A água se acumulou na superfície, formando o primeiro oceano de Izanami e trazendo o fim da era protogênica depois de aproximadamente 400 milhões de anos.
status.eventide-ev-research-results-2.name = [green]>[cyan]Era Biogênica
status.eventide-ev-research-results-2.description = [green]>4.4–3.8 bilhões de anos atrás:\n\n[cyan]> Análises dos gases geotermais e dos corpos d'água de Izanami revelaram evidências dos primeiros estágios de um desenvolvimento biológico.\n\n> Seguindo a formação dos oceanos, os primeiros organismos unicelulares surgiram, sustentados por reações químicas e bioquímicas. Por milhares de anos, essas formas de vida se diversificaram, estabelecendo o primeiro ecossistema marinho.\n\n> Gradualmente, a atividade biológica se espalhou por todos os oceanos, ocupando diferentes nichos e transformando a química da água. Então, Izanami deixou de ser só um planeta geologicamente ativo, e se tornou um planeta vivo.

