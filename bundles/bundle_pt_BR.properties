block.eventide-ev-pro-a07-radioactive-energizer.description = [green]>[cyan]Irradia o caldo de decomposição usando cristais de rybek para isolar e separar os açúcares, como exsudato micelial e trealose, que é usado como combustível e um excelente condutor.
block.eventide-ev-pro-a08-peroxate-refinery.name = [orange]Refinaria de Peroxato
block.eventide-ev-pro-a08-peroxate-refinery.description = [green]>[cyan]Eletrifica e aquece o exsudato micelial a altas temperaturas para purificá-lo, transformando em peroxato, uma substância tão energética que corrói a maioria dos materiais.
block.eventide-ev-pro-a09-sclerotization-chamber.name = [orange]Câmara de Esclerotização
block.eventide-ev-pro-a09-sclerotization-chamber.description = [green]>[cyan]Força o processo de esclerotização tornando a quitina mais dura e resistente.

