block.eventide-ev-02-charcoal-press.description = Esmaga Carvão Vegetal com alta pressão até formar Grafita.

block.eventide-ev-03-silicon-casting.name = Fundidor de Silício
block.eventide-ev-03-silicon-casting.description = Derrete Grafita, Areia e Ferro em Silício. Produz Escória como sub-produto.

block.eventide-ev-04-glass-furnace.name = Fornalha de Vidro
block.eventide-ev-04-glass-furnace.description = Mistura Areia e Metais Derretidos em um Vidro bastante durável.

block.eventide-ev-desintegrator.name = Desintregador
block.eventide-ev-desintegrator.description = Usa energia para queimar itens inseridos.

block.eventide-ev-core-dark.name = Núcleo: Sombra
block.eventide-ev-core-dark.description = Núcleo da Base. Armadurado e Armazena uma quantidade média de itens.

block.eventide-ev-iron-box.name = Caixa de Ferro
block.eventide-ev-iron-box.description = Armazena Itens em Largas Quantidades.

