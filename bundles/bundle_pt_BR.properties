block.eventide-ev-03-iron-wall.description = Protege estruturas de ataques.

block.eventide-ev-04-large-iron-wall.name = Parede Larga de Ferro
block.eventide-ev-04-large-iron-wall.description = Protege estruturas de ataques.

block.eventide-ev-05-rybek-wall.name = Parede de Rybek
block.eventide-ev-05-rybek-wall.description = Protege estruturas de ataques. Causa dano e deixa inimigos lentos, aplicando o efeito Gama.

block.eventide-ev-06-large-rybek-wall.name = Parede de Rybek Larga
block.eventide-ev-06-large-rybek-wall.description = Protege estruturas de ataques. Causa dano e deixa inimigos lentos, aplicando o efeito Gama.

item.eventide-ev-charcoal.name = Carvão Vegetal
item.eventide-ev-charcoal.description = Formado pelas plantas incineradas na superfície de Izanami.

item.eventide-ev-dark-glass.name = Vidro Negro
item.eventide-ev-dark-glass.description = Vidro Negro feito de Areia Negra e Chumbo. Usado na manufatura de unidades e estruturas, e também como munição.

item.eventide-ev-dark-rock.name = Pedra Negra
item.eventide-ev-dark-rock.description = Uma Pedra Negra da superfície chamuscada de Izanami. Usado na construção e manufatura de materiais básicos.

item.eventide-ev-dark-sand.name = Areia Negra
item.eventide-ev-dark-sand.description = Areia Negra da superfície de Izanami. Usado na manufatura de materiais básicos.

item.eventide-ev-dark-soil.name = Solo Negro
item.eventide-ev-dark-soil.description = Solo enegrecido de Izanami. Usado em construção básica, mas também rica em uma variedade de minerais.

item.eventide-ev-gold.name = Ouro
item.eventide-ev-gold.description = Ouro cru encontrado no solo de Izanami. Usado para construção básica e em componentes eletrônicos (pode ser refinado para uso em construções avançadas).

item.eventide-ev-graphite.name = Grafita
item.eventide-ev-graphite.description = Grafita manufaturada em Izanami ao compressar Carvão Vegetal. Um material duravel, de baixa condutividade usado em construções e reatores, mas forte o suficiente para servir de munição.

item.eventide-ev-iron.name = Ferro
item.eventide-ev-iron.description = Ferro encontrado no chão de Izanami. Baixa condutividade mas muito resistente. Usado em uma variedade de projetos de construções e manufatura de itens, também serve de Munição.

item.eventide-ev-lead.name = Chumbo
item.eventide-ev-lead.description = Chumbo, Material durável encontrado no solo de Izanami. Também pode ser usado em construções, reatores, manufatura de outros itens, e até como munição.

item.eventide-ev-rybek-crystals.name = Cristais de Rybek
item.eventide-ev-rybek-crystals.description = Cristais com múltiplas propriedades que se espalharam pela superfície de Izanami após o impacto do Kagutsuchi. São necessários para quase todas as construções em Izanami. Infelizmente, em seu estado cru (não refinado), possuem utilidade extremamente limitada e devem ser refinados para uma melhor aplicação.

item.eventide-ev-silicon.name = Silício
item.eventide-ev-silicon.description = Silício é um componente importante para construção de todos os niveis e para a manufatura de itens avançados e unidades.

liquid.eventide-ev-liq-contamined-water.name = Áqua Contaminada
liquid.eventide-ev-liq-contamined-water.description = Água que fora uma vez um oceano, agora contaminada por minerais tóxicos.

liquid.eventide-ev-liquid-rybek.name = Rybek Líquido
liquid.eventide-ev-liquid-rybek.description = Produzido ao misturar Fragmentos de Rybek com Água Contaminada, este líquido viscoso e quente chega a ser até dez vezes mais radioativo e perigoso que Rybek em sua forma crua. Pode danificar maquinaria e machucar seres vivos no processo. Pode contaminar uma área por um certo periodo se não descartado corretamente.

liquid.eventide-ev-swarm-blood.name = Sangue de Enxame

planet.eventide-izanami.name = Izanami

sector.eventide-19s-01-rebirth.name = Renascimento

sector.eventide-19s-01-rebirth.description = "O início após o fim..."

unit.eventide-ev-pigumi.name = Pigumi
unit.eventide-ev-pigumi.description = Uma unidade de núcleo pequena, mas prática. Protege, constrói, minera, e repara estruturas danificadas.

unit.eventide-ev-gauromydas.name = Gauromydas
unit.eventide-ev-gauromydas.description = Um soldado voador do enxame. Nascer sobre condições específicas durante a fase de metamorfose dos Citheronia.

unit.eventide-ev-aragog.name = Aragog
unit.eventide-ev-aragog.description = Um aracnídeo adolescente que cresceu par se tornar um combatente no Enxame, lançando besouros explosivos no inimígo

unit.eventide-ev-aranicidae-nymph.name = Aracnacana
unit.eventide-ev-aranicidae-nymph.description = Um ninfo da família aracnídea. Se move rápido mas não é muito perigoso sozinho. Porém, pode se tornar um problema em grandes quantidades, danifica estruturas ao contato.

unit.eventide-bettle.name = Besouro
unit.eventide-bettle.description = Nascido para amar. Treinado para explodir.

unit.eventide-ev-03-nukaton-glass-frag.name = ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name = ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name = ev-missile-silicon

unit.eventide-ev-arthropleura.name = Arthropleura
unit.eventide-ev-arthropleura.description = Uma jovem rainha do enxame, desenvolveu uma carapaça extremamente resiliente e uma pele grossa capaz de aguentar radiação. Constantemente gera novos soldados para lutar por ela.

unit.eventide-ev-attakus.name = Attakus
unit.eventide-ev-attakus.description = Um Citheronia que escolheu se manter em seu estado larval, seguindo o caminho da realeza. Essa criatura esta se preparando para dar vida a centenas de novas larvas, mas ainda está muito jovem.

unit.eventide-ev-citheronia.name = Citheronia
unit.eventide-ev-citheronia.description = Uma larva aracnídea, o estágio inicial do ciclo de vida dessa espécie, e o estágio definitivo quando os Aracnídeos decidem entrar em metamorfose ou seguir como uma Centopeia.

unit.eventide-nextage.name = Nextage
unit.eventide-nextage.description = O TOP NÚMERO UM DO BRAZIL BEBÊ!!

status.eventide-ev-01-planetary-research-result.name = Resultados de pesquisa planetaria

status.eventide-ev-01-planetary-research-result.details = [green] Resultados de Pesquisa:\n\n[cyan]> Izanami se formou como um pequeno mundo rochoso orbitando o sol. Sua superfície inicial era vazia e bastante instável, mas com o passar geológico do tempo, água acumulou, e sua atmosfera aos poucos se estabilizou, criando condições sustentáveis de vida...\n\n> O primeiro organismo surgiu das águas de Izanami como micro-organismos primitivos. Passando milhões de anos, a vida se diversificou e se adaptou para quase todos os ambientes do planeta, eventualmente formando uma bioesfera estranhamente densa e complexa...\n\n> Por um periodo desconheicdo, Izanami se manteve em crescimento, até...[red][Dado Corrompido]

status.eventide-ev-research.name = Pesquisas

status.eventide-ev-research.details = [green] Pesquisas feitas em izanami