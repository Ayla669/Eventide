mod.eventide.name =Eventide
mod.eventide.author =[#FC00EB[]]愛蘭-♡
mod.eventide.displayName =[#21FFC5[]]Eventide
mod.eventide.subtitle =[#424B99[]] Un monde mort-vivant...
mod.eventide.description =[#037300[]]Eventide est un mod ambitieux consacré à la création d’une nouvelle campagne avec son propre lore. Il se déroule sur une planète qui regorgeait autrefois d’une vie abondante et ancienne, mais qui est devenue une terre désolée à la suite d’une catastrophe majeure (sans pour autant être dépourvue de vie). La planète est riche en minerais précieux et abrite de nombreuses formes de vie extrêmement territoriales.\n\n[#FF0000[]]Remarque : le mod est encore en début de développement ; de nombreux éléments pourront changer à l’avenir, notamment les sprites, les sons, les ennemis, le lore, etc.\n\n[#83C0E4[]]Contributeurs :\n\n-Collaris\n-C.A.S.E.\n-Mike\n-Sailor
mod.eventide.version =[cyan] C’est encore une démo.
