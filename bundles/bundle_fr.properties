block.eventide-ev-05-razryarost.name =[#55AC60]Razryarost
block.eventide-ev-05-razryarost.description =Détruit violemment les cristaux de Rybek, libérant d’énormes quantités d’énergie. Le processus produit du Rybek liquide, qui est extrêmement dangereux. S’il n’est pas évacué régulièrement, il peut exploser.
block.eventide-ev-01-soil-filter.name =Filtre à sol
block.eventide-ev-01-soil-filter.description =Filtre le sol d’Izanami pour en extraire de petites quantités de minerais.
block.eventide-ev-02-charcoal-press.name =Presse à charbon
block.eventide-ev-02-charcoal-press.description =Comprime le charbon à haute pression jusqu’à ce qu’il se transforme en graphite.
block.eventide-ev-03-silicon-casting.name =Coulée de silicium
block.eventide-ev-03-silicon-casting.description =Fait fondre du graphite, du sable et du fer pour produire du silicium. Produit du laitier comme sous-produit.
block.eventide-ev-04-glass-furnace.name =Four à verre
block.eventide-ev-04-glass-furnace.description =Mélange du sable et des métaux en fusion pour produire un verre extrêmement résistant.
block.eventide-ev-desintegrator.name =Désintégrateur
block.eventide-ev-desintegrator.description =Utilise de l’énergie pour brûler les objets qui y sont introduits et les détruire.
block.eventide-ev-core-dark.name =Noyau : Dark
block.eventide-ev-core-dark.description =Noyau de la base. Blindé, il peut stocker une quantité moyenne d’objets.
block.eventide-ev-iron-box.name =Boîte en fer
block.eventide-ev-iron-box.description =Stocke les objets en plus grandes quantités.
block.eventide-ev-01-gear.name =Gear
block.eventide-ev-01-gear.description =Crache rapidement des balles sur les ennemis.
block.eventide-ev-02-oerlikon.name =Oerlikon
block.eventide-ev-02-oerlikon.description =Une tourelle antiaérienne. Elle tire des obus à fragmentation sur les cibles.
block.eventide-ev-03-nukaton.name =Nukaton
block.eventide-ev-03-nukaton.description =Lance des missiles guidés extrêmement puissants.
block.eventide-ev-02-welder.name =Welder
block.eventide-ev-02-welder.description =Tire un double rayon — chargé en énergie et chauffé avec du laitier.
