block.eventide-ev-03-iron-wall.description =Protège les structures contre les dégâts.
block.eventide-ev-04-large-iron-wall.name =Grand mur de fer
block.eventide-ev-04-large-iron-wall.description =Protège les structures contre les dégâts.
block.eventide-ev-05-rybek-wall.name =Mur de Rybek
block.eventide-ev-05-rybek-wall.description =Protège les structures contre les dégâts. Ralentit les ennemis proches et leur inflige des dégâts en appliquant l’effet Gamma.
block.eventide-ev-06-large-rybek-wall.name =Mur de Rybek
block.eventide-ev-06-large-rybek-wall.description =Protège les structures contre les dégâts. Ralentit les ennemis proches et leur inflige des dégâts en appliquant l’effet Gamma.
item.eventide-ev-charcoal.name =Charbon
item.eventide-ev-charcoal.description =Charbon formé à partir de la végétation incinérée à la surface d’Izanami.
item.eventide-ev-dark-glass.name =Verre sombre
item.eventide-ev-dark-glass.description =Verre sombre fabriqué à partir de sable sombre et de plomb. Utilisé dans la fabrication des unités et des structures, ainsi que comme munition.
item.eventide-ev-dark-rock.name =Roche sombre
item.eventide-ev-dark-rock.description =Une roche sombre provenant de la surface calcinée d’Izanami. Utilisée dans la construction et la fabrication de matériaux de base.
item.eventide-ev-dark-sand.name =Sable sombre
item.eventide-ev-dark-sand.description =Sable sombre provenant de la surface d’Izanami. Utilisé dans la fabrication de matériaux de base.
item.eventide-ev-dark-soil.name =Sol sombre
item.eventide-ev-dark-soil.description =Sol noirci d’Izanami. Utilisé pour des constructions très basiques, mais également riche en une grande variété de minerais.
item.eventide-ev-gold.name =Or
item.eventide-ev-gold.description =Or brut trouvé dans le sol sombre d’Izanami. Utilisé pour la construction de base et les composants électroniques (peut être raffiné pour des constructions avancées).
item.eventide-ev-graphite.name =Graphite
item.eventide-ev-graphite.description =Graphite fabriqué à partir du charbon d’Izanami. Matériau résistant et peu conducteur, utilisé dans la construction et les réacteurs, mais suffisamment solide pour servir de munition.
item.eventide-ev-iron.name =Fer
item.eventide-ev-iron.description =Fer trouvé dans le sol d’Izanami. Il est peu conducteur mais très résistant. Utilisé dans divers projets de construction et pour fabriquer des objets ; il peut également servir de munition.
item.eventide-ev-lead.name =Plomb
item.eventide-ev-lead.description =Plomb, matériau résistant trouvé dans le sol d’Izanami. Il peut être utilisé dans la construction, les réacteurs, la fabrication d’autres objets et même comme munition.
item.eventide-ev-rybek-crystals.name =Cristaux de Rybek
item.eventide-ev-rybek-crystals.description =Des cristaux aux propriétés variées, dispersés à la surface d’Izanami après la collision avec Kagutsuchi. Ils sont nécessaires à presque toutes les constructions sur Izanami. Malheureusement, à l’état brut, leur utilité est extrêmement limitée et ils doivent être raffinés pour des applications plus avancées.
item.eventide-ev-silicon.name =Silicium
item.eventide-ev-silicon.description =Sur Izanami, le silicium est un composant essentiel des constructions de tous niveaux ainsi que de la fabrication d’objets et d’unités avancés.
liquid.eventide-ev-liq-contamined-water.name =Eau contaminée
liquid.eventide-ev-liq-contamined-water.description =De l’eau autrefois propre, désormais contaminée par divers minerais toxiques.
liquid.eventide-ev-liquid-rybek.name =Rybek liquide
liquid.eventide-ev-liquid-rybek.description =Produit en mélangeant des fragments de Rybek avec de l’eau contaminée, ce liquide extrêmement chaud et visqueux est jusqu’à dix fois plus radioactif et dangereux que le Rybek sous sa forme brute. Il peut endommager les machines et nuire aux êtres vivants. Une élimination incorrecte peut contaminer une zone pendant un certain temps.
liquid.eventide-ev-swarm-blood.name =Sang de l’essaim
planet.eventide-izanami.name =Izanami
sector.eventide-19s-01-rebirth.name =Renaissance
sector.eventide-19s-01-rebirth.description ="Le commencement après la fin...
unit.eventide-ev-pigumi.name =Pigumi
unit.eventide-ev-pigumi.description =Une petite unité de noyau, mais pratique. Elle protège, construit, mine et répare les structures endommagées.
unit.eventide-ev-gauromydas.name =Gauromydas
unit.eventide-ev-gauromydas.description =Un soldat volant de l’essaim. Né dans des conditions particulières durant la phase de métamorphose de la Citheronia.
unit.eventide-ev-aragog.name =Aragog
unit.eventide-ev-aragog.description =Un Aranicidae adolescent qui a grandi pour devenir un combattant de l’essaim, lançant des coléoptères explosifs sur ses ennemis.
unit.eventide-ev-aranicidae-nymph.name =Aracnacana
unit.eventide-ev-aranicidae-nymph.description =Une nymphe de la famille des Aranicidae. Elle est rapide mais ne représente presque aucune menace seule. Cependant, elle peut devenir un problème majeur en grand nombre et endommage les structures au contact.
unit.eventide-bettle.name =Bettle
unit.eventide-bettle.description =Né pour aimer. Entraîné pour exploser.
unit.eventide-ev-03-nukaton-glass-frag.name =ev-missile-glass
unit.eventide-ev-03-nukaton-rybek-nuke.name =ev-missile-rybek
unit.eventide-ev-03-nukaton-silicon-homing.name =ev-missile-silicon
unit.eventide-ev-arthropleura.name =Arthropleura
unit.eventide-ev-arthropleura.description =Une jeune reine de l’essaim qui a développé une carapace extrêmement résistante et une peau épaisse capable de supporter les radiations. Elle génère constamment de nouveaux soldats pour combattre à ses côtés.
unit.eventide-ev-attakus.name =Attakus
unit.eventide-ev-attakus.description =Une Citheronia qui a choisi de rester sous sa forme larvaire, suivant la voie de la royauté. Cette créature se prépare à donner naissance à des centaines de nouvelles larves, bien qu’elle soit encore très jeune.
unit.eventide-ev-citheronia.name =Citheronia
unit.eventide-ev-citheronia.description =Une larve d’Aranicidae, stade initial du cycle de vie de cette espèce, et stade définitif où l’Aranicidae décide de subir une métamorphose ou de poursuivre son développement sous sa forme larvaire.
unit.eventide-nextage.name =Nextage
unit.eventide-nextage.description =LE NUMÉRO UN DE BRAZUKA, BÉBÉ !
status.eventide-ev-01-planetary-research-result.details =[green] Résultats de recherche :\n\n[cyan]> Izanami s’est formée comme un petit monde rocheux en orbite autour du Soleil. Sa surface primitive était instable et largement stérile, mais au fil des temps géologiques, la planète s’est refroidie, l’eau s’est accumulée et son atmosphère s’est progressivement stabilisée, créant des conditions propices à la vie...\n\n> Les premiers organismes sont apparus dans les eaux d’Izanami sous la forme de micro-organismes primitifs. Au cours de millions d’années, la vie s’est diversifiée et adaptée à presque tous les environnements de la planète, formant finalement une biosphère exceptionnellement dense et complexe...\n\n> Pendant une période inconnue, Izanami est restée un monde florissant jusqu’à...[red][données corrompues]
