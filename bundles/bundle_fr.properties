block.eventide-ev-01-def-dark-rock-wall.description =Protège les structures contre les dégâts.
block.eventide-ev-02-def-large-dark-rock-wall.name =Grand mur de roche sombre
block.eventide-ev-02-def-large-dark-rock-wall.description =Protège les structures contre les dégâts.
